<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POFlow — PO & Vendor Invoice Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --border:#e2e4e9; --text:#1a1d24; --muted:#6b7280;
    --primary:#2563eb; --primary-dark:#1d4ed8; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{max-width:1200px;margin:0 auto;padding:20px;}
  header.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--border);}
  header.topbar h1{font-size:18px;margin:0;}
  header.topbar .who{font-size:13px;color:var(--muted);}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:14px;}
  .btn-primary{background:var(--primary);color:#fff;border:none;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-danger{background:var(--red);color:#fff;border:none;}
  .btn-green{background:var(--green);color:#fff;border:none;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:14px;margin-top:4px;background:#fff;}
  label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;}
  .badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;display:inline-block;}
  .badge-draft{background:#e5e7eb;color:#374151;}
  .badge-sent{background:#dbeafe;color:#1d4ed8;}
  .badge-pending_approval{background:#fef3c7;color:#92400e;}
  .badge-acknowledged{background:#dbeafe;color:#1d4ed8;}
  .badge-closed{background:#e5e7eb;color:#374151;}
  .badge-cancelled{background:#fee2e2;color:#b91c1c;}
  .badge-submitted{background:#fef3c7;color:#92400e;}
  .badge-under_review{background:#fef3c7;color:#92400e;}
  .badge-approved{background:#dcfce7;color:#15803d;}
  .badge-rejected{background:#fee2e2;color:#b91c1c;}
  .badge-paid{background:#e0e7ff;color:#3730a3;}
  .badge-active{background:#dcfce7;color:#15803d;}
  .badge-pending{background:#fef3c7;color:#92400e;}
  .badge-disabled,.badge-suspended{background:#fee2e2;color:#b91c1c;}
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .tab{padding:10px 16px;cursor:pointer;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-card{width:360px;}
  .row-actions{display:flex;gap:6px;}
  .muted{color:var(--muted);font-size:13px;}
  .stat{font-size:26px;font-weight:700;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:12px;padding:22px;width:460px;max-height:85vh;overflow:auto;}
  .close-x{float:right;cursor:pointer;color:var(--muted);}
  .toast{position:fixed;bottom:20px;right:20px;background:#1a1d24;color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:100;}
  .item-row{display:grid;grid-template-columns:3fr 1fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px;}
  .hidden{display:none;}
  a{color:var(--primary);}
</style>
</head>
<body>

<div id="root"></div>
<div id="toast-holder"></div>

<script>
// ============================================================
// CONFIG — fill these in with your Supabase project details
// ============================================================
const SUPABASE_URL = "https://dqsygmahfyvrxwpdyqcv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxc3lnbWFoZnl2cnh3cGR5cWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzI3MTksImV4cCI6MjEwMjU0ODcxOX0.5fY0In_MQncov1DEaWFH9VONS8i2HoGSk5Ps0m4ytQs";

let sb = null;
let CONFIG_ERROR = null;

function isValidHttpUrl(str){
  try {
    const u = new URL(str);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch(e){ return false; }
}

if(!SUPABASE_URL || SUPABASE_URL === "YOUR_SUPABASE_URL" || !isValidHttpUrl(SUPABASE_URL)){
  CONFIG_ERROR = `SUPABASE_URL is missing or invalid: "${SUPABASE_URL}". It must look like https://xxxxxxxx.supabase.co (from Supabase → Settings → API → Project URL).`;
} else if(!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY" || SUPABASE_ANON_KEY.length < 20){
  CONFIG_ERROR = `SUPABASE_ANON_KEY is missing or looks invalid. Copy the "anon public" key from Supabase → Settings → API.`;
} else {
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch(e){
    CONFIG_ERROR = `Supabase client failed to initialize: ${e.message}`;
  }
}

function renderConfigError(){
  document.getElementById('root').innerHTML = `
  <div class="login-wrap">
    <div class="card login-card" style="width:480px;">
      <h2 style="margin-top:0;color:var(--red);">Setup needed</h2>
      <p>${CONFIG_ERROR}</p>
      <p class="muted">Open index.html, find the two lines near the top of the &lt;script&gt; tag (SUPABASE_URL and SUPABASE_ANON_KEY), and paste in your real values from your Supabase project's Settings → API page. Then re-save/re-upload the file.</p>
    </div>
  </div>`;
}

// Creates a brand-new, isolated Supabase client (its own auth state, not persisted
// to localStorage) purely for signing up OTHER users (company admins, team members).
// This is necessary because calling auth.signUp() on the main `sb` client would
// switch the CURRENT logged-in session over to the newly created user — which is
// exactly what we don't want when a superadmin/admin is creating someone else's login.
function scratchClient(){
  return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
}

// ============================================================
// STATE
// ============================================================
let state = {
  session: null,
  role: null,          // 'superadmin' | 'company_admin' | 'approver' | 'staff' | 'vendor'
  profile: null,        // row from superadmins / company_users / vendors
  company: null,        // current company row (for non-superadmin)
  activeTab: null,
};

function toast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.background = '#b91c1c';
  el.textContent = msg;
  document.getElementById('toast-holder').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

function fmtMoney(n){
  return '₹' + Number(n||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '-';
  return new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function badge(status){
  return `<span class="badge badge-${status}">${status.replace('_',' ')}</span>`;
}
async function logActivity(companyId, action, entityType, entityId, details){
  try{
    await sb.from('activity_log').insert({
      company_id: companyId,
      actor_auth_user_id: state.session.user.id,
      actor_label: `${state.role}: ${state.profile?.name || state.profile?.email || ''}`,
      action, entity_type: entityType, entity_id: entityId, details: details || {}
    });
  }catch(e){ console.warn('activity log failed', e); }
}

// ============================================================
// AUTH / BOOTSTRAP
// ============================================================
async function boot(){
  if(CONFIG_ERROR){ renderConfigError(); return; }
  try{
    const { data: { session } } = await sb.auth.getSession();
    state.session = session;
    if(!session){ renderLogin(); return; }
    await resolveRole();
  } catch(e){
    document.getElementById('root').innerHTML = `
    <div class="login-wrap"><div class="card login-card" style="width:480px;">
      <h2 style="margin-top:0;color:var(--red);">Something went wrong</h2>
      <p>${e.message || e}</p>
      <p class="muted">Open the browser console (F12) for more detail, or check that schema.sql has been run in your Supabase project.</p>
    </div></div>`;
  }
}

async function resolveRole(){
  const uid = state.session.user.id;
  const errors = [];

  let { data: sa, error: saErr } = await sb.from('superadmins').select('*').eq('auth_user_id', uid).maybeSingle();
  if(saErr) errors.push('superadmins: '+saErr.message);
  if(sa){ state.role='superadmin'; state.profile=sa; renderSuperadmin(); return; }

  let { data: cu, error: cuErr } = await sb.from('company_users').select('*, companies(*)').eq('auth_user_id', uid).maybeSingle();
  if(cuErr) errors.push('company_users: '+cuErr.message);
  if(cu){ state.role = cu.role; state.profile = cu; state.company = cu.companies; renderCompanyApp(); return; }

  let { data: v, error: vErr } = await sb.from('vendors').select('*, companies(*)').eq('auth_user_id', uid).maybeSingle();
  if(vErr) errors.push('vendors: '+vErr.message);
  if(v){ state.role='vendor'; state.profile=v; state.company=v.companies; renderVendorApp(); return; }

  // logged in but no role row found yet (or a query above errored — surface it so it's diagnosable)
  document.getElementById('root').innerHTML = `<div class="login-wrap"><div class="card login-card" style="width:480px;">
    <p>Your account isn't linked to a company or vendor profile yet.</p>
    <p class="muted">Ask your company admin (or superadmin) to add you.</p>
    ${errors.length ? `<p style="color:var(--red);font-size:12px;margin-top:10px;">Debug info: ${errors.join(' · ')}</p>` : `<p class="muted" style="font-size:12px;margin-top:10px;">Debug: no errors from the database — no matching row was found for this account (auth uid: ${uid}).</p>`}
    <button class="btn" onclick="signOut()">Sign out</button>
  </div></div>`;
}

async function signOut(){
  await sb.auth.signOut();
  state = {session:null, role:null, profile:null, company:null, activeTab:null};
  renderLogin();
}

// ============================================================
// LOGIN VIEW
// ============================================================
function renderLogin(){
  document.getElementById('root').innerHTML = `
  <div class="login-wrap">
    <div class="card login-card">
      <h2 style="margin-top:0;">POFlow</h2>
      <p class="muted">PO & Vendor Invoice Management</p>
      <div class="tabs" style="margin-bottom:14px;">
        <div class="tab active" id="tab-signin" onclick="switchAuthTab('signin')">Sign in</div>
        <div class="tab" id="tab-signup" onclick="switchAuthTab('signup')">Vendor sign up</div>
      </div>
      <div id="auth-signin">
        <label>Email</label>
        <input id="login-email" type="email" placeholder="you@company.com"/>
        <label style="margin-top:10px;display:block;">Password</label>
        <input id="login-pass" type="password" placeholder="••••••••"/>
        <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="doSignIn()">Sign in</button>
        <p class="muted" id="login-msg" style="margin-top:8px;"></p>
      </div>
      <div id="auth-signup" class="hidden">
        <p class="muted">Vendors: sign up, then wait for the company to activate your account.</p>
        <label>Company invite code / slug</label>
        <input id="signup-slug" placeholder="e.g. abc-traders"/>
        <label style="margin-top:10px;display:block;">Vendor / Business name</label>
        <input id="signup-name" placeholder="Your business name"/>
        <label style="margin-top:10px;display:block;">Email</label>
        <input id="signup-email" type="email"/>
        <label style="margin-top:10px;display:block;">Password</label>
        <input id="signup-pass" type="password"/>
        <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="doVendorSignup()">Create vendor account</button>
        <p class="muted" id="signup-msg" style="margin-top:8px;"></p>
      </div>
    </div>
  </div>`;
}
function switchAuthTab(t){
  document.getElementById('tab-signin').classList.toggle('active', t==='signin');
  document.getElementById('tab-signup').classList.toggle('active', t==='signup');
  document.getElementById('auth-signin').classList.toggle('hidden', t!=='signin');
  document.getElementById('auth-signup').classList.toggle('hidden', t!=='signup');
}
async function doSignIn(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ document.getElementById('login-msg').textContent = error.message; return; }
  state.session = data.session;
  await resolveRole();
}
async function doVendorSignup(){
  const slug = document.getElementById('signup-slug').value.trim();
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-pass').value;
  const msg = document.getElementById('signup-msg');
  const { data: company, error: cerr } = await sb.from('companies').select('id,status').eq('slug', slug).maybeSingle();
  if(cerr || !company){ msg.textContent = 'Company not found — check the invite code.'; return; }
  const { data: sdata, error: serr } = await sb.auth.signUp({ email, password });
  if(serr){ msg.textContent = serr.message; return; }
  const { error: verr } = await sb.from('vendors').insert({
    company_id: company.id, auth_user_id: sdata.user.id, name, email, status: 'pending'
  });
  if(verr){ msg.textContent = verr.message; return; }
  msg.textContent = 'Account created. Waiting for company approval — check email to confirm your address.';
}

// ============================================================
// SHARED SHELL
// ============================================================
function shell(title, roleLabel, bodyHtml){
  return `
  <header class="topbar">
    <h1>POFlow ${title?('— '+title):''}</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="who">${roleLabel}</span>
      <button class="btn btn-sm" onclick="signOut()">Sign out</button>
    </div>
  </header>
  <div class="app">${bodyHtml}</div>`;
}

// ============================================================
// SUPERADMIN VIEW
// ============================================================
async function renderSuperadmin(tab){
  state.activeTab = tab || state.activeTab || 'companies';
  const { data: companies } = await sb.from('companies').select('*').order('created_at', {ascending:false});

  let body = `<div class="tabs">
    <div class="tab ${state.activeTab==='companies'?'active':''}" onclick="renderSuperadmin('companies')">Companies</div>
    <div class="tab ${state.activeTab==='activity'?'active':''}" onclick="renderSuperadmin('activity')">Global Activity</div>
  </div>`;

  if(state.activeTab === 'companies'){
    body += `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">Companies (${companies.length})</h3>
        <button class="btn btn-primary" onclick="openNewCompanyModal()">+ New company</button>
      </div>
      <table style="margin-top:12px;">
        <tr><th>Name</th><th>Slug</th><th>Plan</th><th>Approval levels</th><th>Status</th><th></th></tr>
        ${companies.map(c=>`
          <tr>
            <td>${c.name}</td>
            <td class="muted">${c.slug}</td>
            <td>${c.plan}</td>
            <td>${c.approval_levels}</td>
            <td>${badge(c.status)}</td>
            <td class="row-actions">
              <button class="btn btn-sm" onclick='openCompanyDetail(${JSON.stringify(c.id)})'>Manage</button>
              <button class="btn btn-sm ${c.status==='active'?'btn-danger':'btn-green'}" onclick="toggleCompanyStatus('${c.id}','${c.status}')">${c.status==='active'?'Suspend':'Activate'}</button>
            </td>
          </tr>`).join('')}
      </table>
    </div>`;
  } else {
    const { data: log } = await sb.from('activity_log').select('*, companies(name)').order('created_at',{ascending:false}).limit(100);
    body += `<div class="card"><h3 style="margin-top:0;">Recent activity (all companies)</h3>
      <table><tr><th>When</th><th>Company</th><th>Actor</th><th>Action</th></tr>
      ${(log||[]).map(l=>`<tr><td class="muted">${new Date(l.created_at).toLocaleString('en-IN')}</td><td>${l.companies?.name||''}</td><td>${l.actor_label||''}</td><td>${l.action}</td></tr>`).join('')}
      </table></div>`;
  }

  document.getElementById('root').innerHTML = shell('Superadmin', `${state.profile.name || state.profile.email} · Superadmin`, body);
}

function openNewCompanyModal(){
  showModal(`
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>New company</h3>
    <label>Company name</label><input id="nc-name"/>
    <label style="margin-top:8px;display:block;">Slug (used for vendor signup link)</label><input id="nc-slug" placeholder="e.g. abc-traders"/>
    <label style="margin-top:8px;display:block;">GSTIN</label><input id="nc-gstin"/>
    <label style="margin-top:8px;display:block;">Contact email</label><input id="nc-email"/>
    <label style="margin-top:8px;display:block;">Approval levels</label><input id="nc-levels" type="number" value="1" min="1" max="5"/>
    <hr style="margin:14px 0;border-color:var(--border);">
    <p class="muted">First company admin (they'll receive login credentials):</p>
    <label>Admin email</label><input id="nc-admin-email"/>
    <label style="margin-top:8px;display:block;">Admin temp password (min 6 characters)</label><input id="nc-admin-pass" type="text" placeholder="Set a temp password"/>
    <button class="btn btn-primary" style="width:100%;margin-top:16px;" id="nc-submit-btn" onclick="createCompany()">Create company</button>
    <p style="margin-top:8px;font-size:13px;" id="nc-msg"></p>
  `);
}
async function createCompany(){
  const name = document.getElementById('nc-name').value.trim();
  const slug = document.getElementById('nc-slug').value.trim();
  const gstin = document.getElementById('nc-gstin').value.trim();
  const contact_email = document.getElementById('nc-email').value.trim();
  const approval_levels = parseInt(document.getElementById('nc-levels').value) || 1;
  const adminEmail = document.getElementById('nc-admin-email').value.trim();
  const adminPass = document.getElementById('nc-admin-pass').value;
  const msg = document.getElementById('nc-msg');
  const btn = document.getElementById('nc-submit-btn');

  msg.style.color = 'var(--red)';
  msg.textContent = '';

  if(!name || !slug){ msg.textContent = 'Company name and slug are required.'; return; }
  if(adminEmail && adminPass && adminPass.length < 6){ msg.textContent = 'Admin password must be at least 6 characters (Supabase minimum).'; return; }
  if(adminPass && !adminEmail){ msg.textContent = 'Admin email is required if you set a password.'; return; }

  btn.disabled = true;
  btn.textContent = 'Creating…';

  try{
    const { data: company, error } = await sb.from('companies').insert({name, slug, gstin, contact_email, approval_levels}).select().single();
    if(error){
      msg.textContent = error.code === '23505' ? `That slug is already taken — pick a different one.` : error.message;
      return;
    }

    if(adminEmail && adminPass){
      // Use an isolated client so this signUp doesn't disturb our current (superadmin) session.
      const { data: sdata, error: serr } = await scratchClient().auth.signUp({ email: adminEmail, password: adminPass });
      if(serr){ msg.textContent = 'Company created, but admin account failed: '+serr.message+' — you can add the admin later from the company detail view.'; return; }
      const { error: cuErr } = await sb.from('company_users').insert({
        company_id: company.id, auth_user_id: sdata.user.id, email: adminEmail, role:'company_admin', name: adminEmail
      });
      if(cuErr){ msg.textContent = 'Company created, but linking the admin failed: '+cuErr.message; return; }
    }
    await logActivity(company.id, 'created_company', 'company', company.id, {name});
    closeModal();
    toast('Company created');
    renderSuperadmin('companies');
  } catch(e){
    msg.textContent = 'Unexpected error: ' + (e.message || e);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Create company'; }
  }
}
async function toggleCompanyStatus(id, current){
  const next = current==='active' ? 'suspended' : 'active';
  await sb.from('companies').update({status: next}).eq('id', id);
  toast(`Company ${next}`);
  renderSuperadmin('companies');
}
async function openCompanyDetail(id){
  const { data: c } = await sb.from('companies').select('*').eq('id',id).single();
  const { data: users } = await sb.from('company_users').select('*').eq('company_id', id);
  const { data: vendors } = await sb.from('vendors').select('*').eq('company_id', id);
  const { data: pos } = await sb.from('purchase_orders').select('id').eq('company_id', id);
  const { data: invs } = await sb.from('invoices').select('id,status').eq('company_id', id);
  showModal(`
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>${c.name}</h3>
    <p class="muted">${c.slug} · ${c.gstin||'no GSTIN on file'}</p>
    <div class="grid grid-3">
      <div class="card"><div class="stat">${users.length}</div><div class="muted">Staff users</div></div>
      <div class="card"><div class="stat">${vendors.length}</div><div class="muted">Vendors</div></div>
      <div class="card"><div class="stat">${pos.length}</div><div class="muted">POs</div></div>
    </div>
    <p class="muted" style="margin-top:10px;">Invoices: ${(invs||[]).length} total ·
      ${(invs||[]).filter(i=>i.status==='approved').length} approved ·
      ${(invs||[]).filter(i=>['submitted','under_review'].includes(i.status)).length} pending</p>
    <label style="margin-top:10px;display:block;">Approval levels (invoices, and POs if PO approval is on)</label>
    <input id="cd-levels" type="number" value="${c.approval_levels}" min="1" max="5"/>
    <label style="margin-top:8px;display:block;">Annual budget (optional)</label>
    <input id="cd-budget" type="number" value="${c.annual_budget||''}"/>
    <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="updateApprovalLevels('${id}')">Save</button>
  `);
}
async function updateApprovalLevels(id){
  const v = parseInt(document.getElementById('cd-levels').value)||1;
  const budget = document.getElementById('cd-budget').value ? parseFloat(document.getElementById('cd-budget').value) : null;

async function actOnPO(id, action){
  const comments = document.getElementById('po-appr-comments').value;
  const { data: po } = await sb.from('purchase_orders').select('*').eq('id', id).single();
  const levels = state.company.approval_levels || 1;
  await sb.from('po_approvals').insert({ po_id: id, approver_id: state.profile.id, level: po.current_approval_level, action, comments });
  if(action === 'rejected'){
    await sb.from('purchase_orders').update({status:'rejected'}).eq('id', id);
  } else {
    if(po.current_approval_level >= levels){
      await sb.from('purchase_orders').update({status:'approved'}).eq('id', id);
    } else {
      await sb.from('purchase_orders').update({status:'pending_approval', current_approval_level: po.current_approval_level+1}).eq('id', id);
    }
  }
  await logActivity(state.company.id, `po_${action}`, 'purchase_order', id, {comments});
  closeModal(); toast('Recorded'); renderCompanyApp('pos');
}

// ---- PO creation ----
// ---- GST: CGST+SGST (intrastate) vs IGST (interstate) ----
// Determined by comparing the first 2 digits (state code) of the company's GSTIN
// and the selected vendor's GSTIN. If either is missing, we can't determine this
// and fall back to showing GST as a single combined figure.
function gstStateCode(gstin){
  return (gstin && gstin.length >= 2) ? gstin.slice(0,2) : null;
}
function currentPOTaxSplit(){
  const vendorSelect = document.getElementById('po-vendor');
  const opt = vendorSelect?.options[vendorSelect.selectedIndex];
  const vendorGstin = opt?.dataset?.gstin || '';
  const companyGstin = state.company.gstin || '';
  const cCode = gstStateCode(companyGstin);
  const vCode = gstStateCode(vendorGstin);
  if(!cCode || !vCode) return 'unknown';
  return cCode === vCode ? 'intrastate' : 'interstate';
}


// Chapter-level HSN and common SAC prefixes mapped to the typical GST rate.
// This is an indicative lookup only — many HSN codes have exceptions/notifications
// that override the chapter default, so the rate is always editable after lookup.
const HSN_GST_TABLE = {
  // common goods chapters (2-digit HSN chapter prefix)
  '01':5,'02':5,'03':5,'04':5,'07':5,'08':5,'09':5,'10':0,'11':5,'12':5,'15':5,'16':12,'17':5,
  '19':18,'20':12,'21':18,'22':18,'25':5,'27':18,'28':18,'29':18,'30':12,'32':18,'33':18,'34':18,
  '38':18,'39':18,'40':18,'42':28,'44':12,'48':12,'49':12,'52':5,'54':5,'61':12,'62':12,'63':5,
  '64':18,'69':18,'70':18,'71':3,'72':18,'73':18,'74':18,'76':18,'82':18,'83':18,'84':18,'85':18,
  '87':28,'90':18,'94':18,'95':12,'96':18,
  // common SAC (services) prefixes — 6-digit, matched by first 6 or first 4
  '9954':18,'9963':12,'9965':18,'9966':18,'9971':18,'9972':18,'9973':18,'9983':18,'9985':18,
  '9987':18,'9988':18,'9997':18,'998311':18,'998313':18,'998714':18
};
function lookupGSTFromHSN(code){
  if(!code) return null;
  const c = code.trim();
  if(HSN_GST_TABLE[c] !== undefined) return HSN_GST_TABLE[c];
  if(c.length>=6 && HSN_GST_TABLE[c.slice(0,6)] !== undefined) return HSN_GST_TABLE[c.slice(0,6)];
  if(c.length>=4 && HSN_GST_TABLE[c.slice(0,4)] !== undefined) return HSN_GST_TABLE[c.slice(0,4)];
  if(c.length>=2 && HSN_GST_TABLE[c.slice(0,2)] !== undefined) return HSN_GST_TABLE[c.slice(0,2)];
  return null;
}
function onHSNInput(id){
  const hsn = document.getElementById(`po-item-hsn-${id}`)?.value;
  const rate = lookupGSTFromHSN(hsn);
  if(rate !== null){
    document.getElementById(`po-item-gst-${id}`).value = rate;
  }
  recalcPOTotal();
}

  if(!name) return;
  const items = collectPOItems();
  if(items.length===0){ toast('Add at least one item first', true); return; }
  const vendor_id = document.getElementById('po-vendor').value || null;
  const { error } = await sb.from('po_templates').insert({ company_id: state.company.id, name, vendor_id, items, created_by: state.profile.id });
  if(error){ toast(error.message, true); return; }
  toast('Template saved');
}
function addPOItem(){
  poItemCount++;
  const id = poItemCount;
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = `po-item-${id}`;
  div.style.gridTemplateColumns = '2.2fr 1fr 0.8fr 1fr 0.8fr 1fr auto';
  div.innerHTML = `
    <input placeholder="Description" oninput="recalcPOTotal()" id="po-item-desc-${id}"/>
    <input placeholder="HSN/SAC" oninput="onHSNInput(${id})" id="po-item-hsn-${id}"/>
    <input type="number" placeholder="Qty" value="1" oninput="recalcPOTotal()" id="po-item-qty-${id}"/>
    <input type="number" placeholder="Unit price" oninput="recalcPOTotal()" id="po-item-price-${id}"/>
    <input type="number" placeholder="GST%" oninput="recalcPOTotal()" id="po-item-gst-${id}"/>
    <span id="po-item-amt-${id}" class="muted">₹0.00</span>
    <button class="btn btn-sm btn-danger" onclick="document.getElementById('po-item-${id}').remove(); recalcPOTotal();">✕</button>
  `;
  document.getElementById('po-items').appendChild(div);
}
function collectPOItems(){
  const items = [];
  document.querySelectorAll('#po-items .item-row').forEach(row=>{
    const id = row.id.split('-').pop();
    const desc = document.getElementById(`po-item-desc-${id}`)?.value;
    const hsn = document.getElementById(`po-item-hsn-${id}`)?.value || '';
    const qty = parseFloat(document.getElementById(`po-item-qty-${id}`)?.value)||0;
    const price = parseFloat(document.getElementById(`po-item-price-${id}`)?.value)||0;
    const gst_rate = parseFloat(document.getElementById(`po-item-gst-${id}`)?.value)||0;
    const taxable_amount = qty*price;
    const tax_amount = taxable_amount * gst_rate/100;
    if(desc) items.push({description:desc, hsn, qty, unit_price:price, gst_rate, taxable_amount, tax_amount, amount: taxable_amount + tax_amount});
  });
  return items;
}
function recalcPOTotal(){
  const items = collectPOItems();
  document.querySelectorAll('#po-items .item-row').forEach(row=>{
    const id = row.id.split('-').pop();
    const qty = parseFloat(document.getElementById(`po-item-qty-${id}`)?.value)||0;
    const price = parseFloat(document.getElementById(`po-item-price-${id}`)?.value)||0;
    const gst_rate = parseFloat(document.getElementById(`po-item-gst-${id}`)?.value)||0;
    const taxable = qty*price;
    document.getElementById(`po-item-amt-${id}`).textContent = fmtMoney(taxable + taxable*gst_rate/100);
  });
  const subtotal = items.reduce((s,i)=>s+i.taxable_amount,0);
  const tax = items.reduce((s,i)=>s+i.tax_amount,0);
  const split = currentPOTaxSplit();
  let taxLinesHtml = '';
  if(split === 'intrastate'){
    taxLinesHtml = `<div>CGST: ${fmtMoney(tax/2)}</div><div>SGST: ${fmtMoney(tax/2)}</div>`;
  } else if(split === 'interstate'){
    taxLinesHtml = `<div>IGST: ${fmtMoney(tax)}</div>`;
  } else {
    taxLinesHtml = `<div>GST (type undetermined — add GSTINs to split into CGST/SGST or IGST): ${fmtMoney(tax)}</div>`;
  }
  document.getElementById('po-subtotal').textContent = fmtMoney(subtotal);
  document.getElementById('po-tax-lines').innerHTML = taxLinesHtml;
  document.getElementById('po-total').textContent = fmtMoney(subtotal+tax);
}
async function createPO(){
  const msg = document.getElementById('po-msg');
  const btn = document.getElementById('po-submit-btn');
  msg.textContent = '';
  const po_number = document.getElementById('po-number').value.trim();
  const vendor_id = document.getElementById('po-vendor').value;
  const expected_delivery_date = document.getElementById('po-date').value || null;
  const notes = document.getElementById('po-notes').value;
  const items = collectPOItems();
  const subtotal = items.reduce((s,i)=>s+i.taxable_amount,0);
  const tax_amount = items.reduce((s,i)=>s+i.tax_amount,0);
  if(!po_number){ msg.textContent = 'PO number is required.'; return; }
  if(!vendor_id){ msg.textContent = 'Select a vendor — if none are listed, add an active vendor first from the Vendors tab.'; return; }
  if(items.length===0){ msg.textContent = 'Add at least one item.'; return; }

  btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const initialStatus = state.company.po_requires_approval ? 'pending_approval' : 'draft';
    const split = currentPOTaxSplit();
    const cgst_amount = split === 'intrastate' ? tax_amount/2 : 0;
    const sgst_amount = split === 'intrastate' ? tax_amount/2 : 0;
    const igst_amount = split === 'interstate' ? tax_amount : 0;
    const { data, error } = await sb.from('purchase_orders').insert({
      company_id: state.company.id, po_number, vendor_id, items, subtotal,
      tax_amount, cgst_amount, sgst_amount, igst_amount, tax_type: split === 'unknown' ? null : split,
      total_amount: subtotal+tax_amount, expected_delivery_date, notes,
      created_by: state.profile.id, status: initialStatus
    }).select().single();
    if(error){ msg.textContent = error.code === '23505' ? 'That PO number is already used — pick a different one.' : error.message; return; }
    await logActivity(state.company.id, 'created_po', 'purchase_order', data.id, {po_number});
    closeModal();
    toast(initialStatus==='pending_approval' ? 'PO created — pending approval' : 'PO created as draft');
    renderCompanyApp('pos');
  } catch(e){
    msg.textContent = 'Unexpected error: ' + (e.message || e);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Create PO'; }
  }
}
async function sendPO(id){
  await sb.from('purchase_orders').update({status:'sent'}).eq('id', id);
  await logActivity(state.company.id, 'sent_po', 'purchase_order', id, {});
  toast('PO sent to vendor'); renderCompanyApp('pos');
}

// ---- Print / PDF export of a PO (opens a formatted print view; browser's
// "Save as PDF" in the print dialog produces the actual PDF file) ----
async function printPO(id){
  const { data: po, error } = await sb.from('purchase_orders').select('*, vendors(*)').eq('id', id).single();
  if(error){ toast('Could not load PO: '+error.message, true); return; }
  const c = state.company;
  const v = po.vendors;
  const itemRows = (po.items||[]).map((it,idx)=>`
    <tr>
      <td>${idx+1}</td>
      <td>${it.description||''}</td>
      <td>${it.hsn||'-'}</td>
      <td style="text-align:right;">${it.qty}</td>
      <td style="text-align:right;">${fmtMoney(it.unit_price)}</td>
      <td style="text-align:right;">${it.gst_rate||0}%</td>
      <td style="text-align:right;">${fmtMoney((it.taxable_amount!==undefined?it.taxable_amount:it.qty*it.unit_price))}</td>
    </tr>`).join('');
  let taxRows = '';
  if(po.tax_type === 'intrastate'){
    taxRows = `<tr><td colspan="6" style="text-align:right;">CGST</td><td style="text-align:right;">${fmtMoney(po.cgst_amount)}</td></tr>
               <tr><td colspan="6" style="text-align:right;">SGST</td><td style="text-align:right;">${fmtMoney(po.sgst_amount)}</td></tr>`;
  } else if(po.tax_type === 'interstate'){
    taxRows = `<tr><td colspan="6" style="text-align:right;">IGST</td><td style="text-align:right;">${fmtMoney(po.igst_amount)}</td></tr>`;
  } else {
    taxRows = `<tr><td colspan="6" style="text-align:right;">GST</td><td style="text-align:right;">${fmtMoney(po.tax_amount)}</td></tr>`;
  }
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${po.po_number}</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;color:#111;padding:32px;font-size:13px;}
    h1{font-size:20px;margin:0 0 4px;}
    .muted{color:#666;font-size:12px;}
    table{width:100%;border-collapse:collapse;margin-top:16px;}
    th,td{border:1px solid #ccc;padding:6px 8px;font-size:12px;}
    th{background:#f4f5f7;text-align:left;}
    .grid{display:flex;justify-content:space-between;margin-top:20px;}
    .box{width:48%;}
    .box h3{font-size:12px;text-transform:uppercase;color:#666;margin-bottom:4px;}
    .total-row td{font-weight:bold;}
    @media print{ .no-print{display:none;} }
  </style></head><body>
    <h1>Purchase Order</h1>
    <p class="muted">PO Number: <strong>${po.po_number}</strong> &nbsp; | &nbsp; Date: ${fmtDate(po.created_at)} &nbsp; | &nbsp; Status: ${po.status}</p>
    <div class="grid">
      <div class="box">
        <h3>From</h3>
        <div><strong>${c.name}</strong></div>
        <div>${c.address||''}</div>
        <div>GSTIN: ${c.gstin||'—'}</div>
        <div>${c.contact_email||''}</div>
      </div>
      <div class="box">
        <h3>Vendor</h3>
        <div><strong>${v?.name||''}</strong></div>
        <div>${v?.address||''}</div>
        <div>GSTIN: ${v?.gstin||'—'}</div>
        <div>${v?.email||''}</div>
      </div>
    </div>
    <table>
      <tr><th>#</th><th>Description</th><th>HSN/SAC</th><th>Qty</th><th>Unit Price</th><th>GST%</th><th>Amount</th></tr>
      ${itemRows}
      <tr><td colspan="6" style="text-align:right;">Taxable amount</td><td style="text-align:right;">${fmtMoney(po.subtotal)}</td></tr>
      ${taxRows}
      <tr class="total-row"><td colspan="6" style="text-align:right;">Total</td><td style="text-align:right;">${fmtMoney(po.total_amount)}</td></tr>
    </table>
    ${po.notes ? `<p style="margin-top:16px;"><strong>Notes:</strong> ${po.notes}</p>` : ''}
    ${po.expected_delivery_date ? `<p class="muted">Expected delivery: ${fmtDate(po.expected_delivery_date)}</p>` : ''}
    <button class="no-print" onclick="window.print()" style="margin-top:24px;padding:10px 18px;">Print / Save as PDF</button>
    <scr`+`ipt>window.onload = () => window.print();</scr`+`ipt>
  </body></html>`;
  const w = window.open('', '_blank');
  if(!w){ toast('Please allow pop-ups to view/print the PO', true); return; }
  w.document.write(html);
  w.document.close();
}

// ---- Invoice review / approval ----
async function openInvoiceModal(id){
  const { data: inv } = await sb.from('invoices').select('*, vendors(name,email), purchase_orders(po_number,total_amount)').eq('id',id).single();
  const { data: fileUrl } = await sb.storage.from('invoices').createSignedUrl(inv.file_path, 3600);
  const { data: history } = await sb.from('approvals').select('*, company_users(name,email)').eq('invoice_id', id).order('acted_at');
  const levels = state.company.approval_levels || 1;
  const canApprove = state.role === 'company_admin' || (state.role==='approver' && state.profile.approval_level === inv.current_approval_level);

  showModal(`
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>Invoice ${inv.invoice_number}</h3>
    <p class="muted">Vendor: ${inv.vendors?.name} · PO: ${inv.purchase_orders?.po_number}</p>
    <p>Amount: <strong>${fmtMoney(inv.total_amount)}</strong> &nbsp; Status: ${badge(inv.status)}</p>
    <p>Approval progress: level ${inv.current_approval_level} of ${levels}</p>
    ${fileUrl?.signedUrl ? `<p><a href="${fileUrl.signedUrl}" target="_blank">View invoice file →</a></p>` : ''}
    <div style="margin-top:10px;">
      <h4 style="margin-bottom:4px;">History</h4>
      ${(history||[]).length ? history.map(h=>`<p class="muted">${badge(h.action)} by ${h.company_users?.name||h.company_users?.email} on ${fmtDate(h.acted_at)} ${h.comments?('— '+h.comments):''}</p>`).join('') : '<p class="muted">No actions yet.</p>'}
    </div>
    ${(canApprove && ['submitted','under_review'].includes(inv.status)) ? `
      <label style="margin-top:10px;display:block;">Comments</label>
      <textarea id="inv-comments" rows="2"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-green" style="flex:1;" onclick="actOnInvoice('${id}','approved')">Approve</button>
        <button class="btn btn-danger" style="flex:1;" onclick="actOnInvoice('${id}','rejected')">Reject</button>
      </div>
    ` : (['submitted','under_review'].includes(inv.status) ? '<p class="muted">Waiting on a different approval level.</p>' : '')}
  `);
}
async function actOnInvoice(id, action){
  const comments = document.getElementById('inv-comments').value;
  const { data: inv } = await sb.from('invoices').select('*').eq('id', id).single();
  const levels = state.company.approval_levels || 1;

  await sb.from('approvals').insert({
    invoice_id: id, approver_id: state.profile.id, level: inv.current_approval_level, action, comments
  });

  if(action === 'rejected'){
    await sb.from('invoices').update({status:'rejected', rejection_reason: comments}).eq('id', id);
  } else {
    if(inv.current_approval_level >= levels){
      await sb.from('invoices').update({status:'approved'}).eq('id', id);
    } else {
      await sb.from('invoices').update({status:'under_review', current_approval_level: inv.current_approval_level+1}).eq('id', id);
    }
  }
  await logActivity(state.company.id, `invoice_${action}`, 'invoice', id, {comments});
  closeModal(); toast('Recorded'); renderCompanyApp('invoices');
}

async function renderVendorApp(tab){
  state.activeTab = tab || state.activeTab || 'pos';
  const vid = state.profile.id;

  if(state.profile.status !== 'active'){
    document.getElementById('root').innerHTML = shell(state.company.name, `${state.profile.name} · Vendor`, `
      <div class="card"><p>Your account is <strong>${state.profile.status}</strong>. You'll be able to view POs and submit invoices once the company activates your account.</p></div>
    `);
    return;
  }

  let body = `<div class="tabs">
    <div class="tab ${state.activeTab==='pos'?'active':''}" onclick="renderVendorApp('pos')">My Purchase Orders</div>
    <div class="tab ${state.activeTab==='invoices'?'active':''}" onclick="renderVendorApp('invoices')">My Invoices</div>
  </div>`;

  if(state.activeTab === 'pos'){
    const { data: pos } = await sb.from('purchase_orders').select('*').eq('vendor_id',vid).in('status',['sent','acknowledged','closed']).order('created_at',{ascending:false});
    body += `<div class="card"><h3 style="margin-top:0;">Purchase Orders sent to you</h3>
      <table><tr><th>PO #</th><th>Amount</th><th>Status</th><th>Expected delivery</th><th></th></tr>
      ${(pos||[]).map(p=>`<tr>
        <td>${p.po_number}</td><td>${fmtMoney(p.total_amount)}</td><td>${badge(p.status)}</td><td class="muted">${fmtDate(p.expected_delivery_date)}</td>
        <td><button class="btn btn-sm btn-primary" onclick='openUploadInvoiceModal(${JSON.stringify(p.id)},${JSON.stringify(p.po_number)})'>Upload invoice</button></td>
      </tr>`).join('') || '<tr><td colspan="5" class="muted">No POs yet.</td></tr>'}
      </table>
    </div>`;
  } else {
    const { data: invs } = await sb.from('invoices').select('*, purchase_orders(po_number)').eq('vendor_id',vid).order('submitted_at',{ascending:false});
    body += `<div class="card"><h3 style="margin-top:0;">My submitted invoices</h3>
      <table><tr><th>Invoice #</th><th>PO</th><th>Amount</th><th>Status</th><th>Submitted</th></tr>
      ${(invs||[]).map(i=>`<tr>
        <td>${i.invoice_number}</td><td>${i.purchase_orders?.po_number||''}</td><td>${fmtMoney(i.total_amount)}</td>
        <td>${badge(i.status)}${i.status==='rejected'&&i.rejection_reason?`<div class="muted">${i.rejection_reason}</div>`:''}</td>
        <td class="muted">${fmtDate(i.submitted_at)}</td>
      </tr>`).join('') || '<tr><td colspan="5" class="muted">No invoices submitted yet.</td></tr>'}
      </table>
    </div>`;
  }

  document.getElementById('root').innerHTML = shell(state.company.name, `${state.profile.name} · Vendor`, body);
}

function openUploadInvoiceModal(poId, poNumber){
  showModal(`
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>Upload invoice for ${poNumber}</h3>
    <label>Invoice number</label><input id="ui-number"/>
    <label style="margin-top:8px;display:block;">Invoice date</label><input id="ui-date" type="date"/>
    <label style="margin-top:8px;display:block;">Amount (excl. tax)</label><input id="ui-amount" type="number"/>
    <label style="margin-top:8px;display:block;">Tax amount</label><input id="ui-tax" type="number" value="0"/>
    <label style="margin-top:8px;display:block;">Invoice file (PDF/image)</label><input id="ui-file" type="file" accept=".pdf,.jpg,.jpeg,.png"/>
    <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="submitInvoice('${poId}')">Submit for approval</button>
    <p class="muted" id="ui-msg"></p>
  `);
}
async function submitInvoice(poId){
  const msg = document.getElementById('ui-msg');
  const invoice_number = document.getElementById('ui-number').value.trim();
  const invoice_date = document.getElementById('ui-date').value;
  const amount = parseFloat(document.getElementById('ui-amount').value)||0;
  const tax_amount = parseFloat(document.getElementById('ui-tax').value)||0;
  const file = document.getElementById('ui-file').files[0];
  if(!invoice_number || !invoice_date || !amount || !file){ msg.textContent = 'All fields and a file are required.'; return; }

  const path = `${state.profile.id}/${Date.now()}_${file.name}`;
  const { error: upErr } = await sb.storage.from('invoices').upload(path, file);
  if(upErr){ msg.textContent = 'File upload failed: '+upErr.message; return; }

  const { data, error } = await sb.from('invoices').insert({
    company_id: state.company.id, po_id: poId, vendor_id: state.profile.id,
    invoice_number, invoice_date, file_path: path, amount, tax_amount,
    total_amount: amount+tax_amount, status:'submitted', current_approval_level: 1
  }).select().single();
  if(error){ msg.textContent = error.message; return; }
  await logActivity(state.company.id, 'uploaded_invoice', 'invoice', data.id, {invoice_number});
  closeModal(); toast('Invoice submitted for approval'); renderVendorApp('invoices');
}
