async function applyPOTemplate(templateId){
  if(!templateId) return;
  const { data: t } = await sb.from('po_templates').select('*').eq('id', templateId).single();
  document.getElementById('po-items').innerHTML = '';
  poItemCount = 0;
  (t.items||[]).forEach(it=>{
    addPOItem();
    const id = poItemCount;
    document.getElementById(`po-item-desc-${id}`).value = it.description || '';
    document.getElementById(`po-item-hsn-${id}`).value = it.hsn || '';
    document.getElementById(`po-item-qty-${id}`).value = it.qty || 1;
    document.getElementById(`po-item-price-${id}`).value = it.unit_price || 0;
    document.getElementById(`po-item-gst-${id}`).value = (it.gst_rate ?? '') === '' ? '' : it.gst_rate;
  });
  if(t.vendor_id) document.getElementById('po-vendor').value = t.vendor_id;
  recalcPOTotal();
}
async function saveAsTemplate(){
  const name = prompt('Template name:');
  if(!name) return;
  const items = collectPOItems();
  if(items.length===0){ toast('Add at least one item first', true); return; }
  const vendor_id = document.getElementById('po-vendor').value || null;
  const { error } = await sb.from('po_templates').insert({ company_id: state.company.id, name, vendor_id, items, created_by: state.profile.id });
  if(error){ toast(error.message, true); return; }
  toast('Template saved');
}
function addPOItem(){
  poItemCount++;
  const id = poItemCount;
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = `po-item-${id}`;
  div.style.gridTemplateColumns = '2.2fr 1.1fr 0.7fr 1fr 0.7fr 1.1fr 32px';
  div.innerHTML = `
    <input placeholder="Description" oninput="recalcPOTotal()" id="po-item-desc-${id}"/>
    <input placeholder="HSN/SAC" oninput="onHSNInput(${id})" id="po-item-hsn-${id}"/>
    <input type="number" placeholder="Qty" value="1" oninput="recalcPOTotal()" id="po-item-qty-${id}"/>
    <input type="number" placeholder="Price" oninput="recalcPOTotal()" id="po-item-price-${id}"/>
    <input type="number" placeholder="GST%" oninput="onGSTManualEdit(${id})" id="po-item-gst-${id}"/>
    <span id="po-item-amt-${id}" class="muted" style="font-size:12px;align-self:center;">₹0.00</span>
    <button class="btn btn-sm btn-danger" style="padding:4px 8px;" onclick="document.getElementById('po-item-${id}').remove(); recalcPOTotal();">✕</button>
  `;

}
function collectPOItems(){
  const items = [];
  document.querySelectorAll('#po-items .item-row').forEach(row=>{
    const id = row.id.split('-').pop();
    const desc = document.getElementById(`po-item-desc-${id}`)?.value;
    const hsn = document.getElementById(`po-item-hsn-${id}`)?.value || '';
    const qty = parseFloat(document.getElementById(`po-item-qty-${id}`)?.value)||0;
    const price = parseFloat(document.getElementById(`po-item-price-${id}`)?.value)||0;
    const gst_rate = parseFloat(document.getElementById(`po-item-gst-${id}`)?.value)||0;
    const taxable_amount = qty*price;
    const tax_amount = taxable_amount * gst_rate/100;
    if(desc) items.push({description:desc, hsn, qty, unit_price:price, gst_rate, taxable_amount, tax_amount, amount: taxable_amount + tax_amount});
  });
  return items;
}
function recalcPOTotal(){
  const items = collectPOItems();
  document.querySelectorAll('#po-items .item-row').forEach(row=>{
    const id = row.id.split('-').pop();
    const qty = parseFloat(document.getElementById(`po-item-qty-${id}`)?.value)||0;
    const price = parseFloat(document.getElementById(`po-item-price-${id}`)?.value)||0;
    const gst_rate = parseFloat(document.getElementById(`po-item-gst-${id}`)?.value)||0;
    const taxable = qty*price;
    document.getElementById(`po-item-amt-${id}`).textContent = fmtMoney(taxable + taxable*gst_rate/100);
  });
  const subtotal = items.reduce((s,i)=>s+i.taxable_amount,0);
  const tax = items.reduce((s,i)=>s+i.tax_amount,0);
  const split = currentPOTaxSplit();
  let taxLinesHtml = '';
  if(split === 'intrastate'){
    taxLinesHtml = `<div>CGST: ${fmtMoney(tax/2)}</div><div>SGST: ${fmtMoney(tax/2)}</div>`;
  } else if(split === 'interstate'){
    taxLinesHtml = `<div>IGST: ${fmtMoney(tax)}</div>`;
  } else {
    taxLinesHtml = `<div>GST (type undetermined — add GSTINs to split into CGST/SGST or IGST): ${fmtMoney(tax)}</div>`;
  }
  document.getElementById('po-subtotal').textContent = fmtMoney(subtotal);
  document.getElementById('po-tax-lines').innerHTML = taxLinesHtml;
  document.getElementById('po-total').textContent = fmtMoney(subtotal+tax);
}
async function createPO(){
  const msg = document.getElementById('po-msg');
  const btn = document.getElementById('po-submit-btn');
  msg.textContent = '';
  const po_number = document.getElementById('po-number').value.trim();
  const vendor_id = document.getElementById('po-vendor').value;
  const expected_delivery_date = document.getElementById('po-date').value || null;
  const notes = document.getElementById('po-notes').value;
  const items = collectPOItems();
  const subtotal = items.reduce((s,i)=>s+i.taxable_amount,0);
  const tax_amount = items.reduce((s,i)=>s+i.tax_amount,0);
  if(!po_number){ msg.textContent = 'PO number is required.'; return; }
  if(!vendor_id){ msg.textContent = 'Select a vendor — if none are listed, add an active vendor first from the Vendors tab.'; return; }
  if(items.length===0){ msg.textContent = 'Add at least one item.'; return; }

  const docCount = await docsThisMonth();
  if(!planAllowsMore(docCount, state.plan?.max_docs_per_month)){
    msg.textContent = `Your ${state.plan.plan} plan allows ${state.plan.max_docs_per_month} POs+invoices per month (used ${docCount}). Upgrade for more.`;
    return;
  }

  btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const initialStatus = state.company.po_requires_approval ? 'pending_approval' : 'draft';
    const split = currentPOTaxSplit();
    const cgst_amount = split === 'intrastate' ? tax_amount/2 : 0;
    const sgst_amount = split === 'intrastate' ? tax_amount/2 : 0;
    const igst_amount = split === 'interstate' ? tax_amount : 0;
    const { data, error } = await sb.from('purchase_orders').insert({
      company_id: state.company.id, po_number, vendor_id, items, subtotal,
      tax_amount, cgst_amount, sgst_amount, igst_amount, tax_type: split === 'unknown' ? null : split,
      total_amount: subtotal+tax_amount, expected_delivery_date, notes,
      created_by: state.profile.id, status: initialStatus
    }).select().single();
    if(error){ msg.textContent = error.code === '23505' ? 'That PO number is already used — pick a different one.' : error.message; return; }
    await logActivity(state.company.id, 'created_po', 'purchase_order', data.id, {po_number});
    closeModal();
    toast(initialStatus==='pending_approval' ? 'PO created — pending approval' : 'PO created as draft');
    renderCompanyApp('pos');
  } catch(e){
    msg.textContent = 'Unexpected error: ' + (e.message || e);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Create PO'; }
  }
}
async function sendPO(id){
  await sb.from('purchase_orders').update({status:'sent'}).eq('id', id);
  await logActivity(state.company.id, 'sent_po', 'purchase_order', id, {});
  toast('PO sent to vendor'); renderCompanyApp('pos');
}

// ---- number to Indian-format words (for PO amount in words) ----
function numberToWordsIndian(num){
  num = Math.round(Number(num)||0);
  if(num === 0) return 'Zero';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){
    if(n < 20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
  }
  function threeDigits(n){
    return (n >= 100 ? ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' : '') : '') + (n%100 ? twoDigits(n%100) : '');
  }
  let result = '';
  const crore = Math.floor(num/10000000); num %= 10000000;
  const lakh = Math.floor(num/100000); num %= 100000;
  const thousand = Math.floor(num/1000); num %= 1000;
  const hundred = num;
  if(crore) result += threeDigits(crore) + ' Crore ';
  if(lakh) result += twoDigits(lakh) + ' Lakh ';
  if(thousand) result += twoDigits(thousand) + ' Thousand ';
  if(hundred) result += threeDigits(hundred);
  return result.trim();
}

// ---- Invoice ↔ PO matching (3-way style check) ----
// Compares the vendor's submitted invoice against the PO it's billed against and
// returns a status of matched / partial / unmatched with human-readable reasons.
function matchInvoiceToPO(inv, po){
  const reasons = [];
  if(!po){ return {status:'unmatched', reasons:['No linked purchase order found for this invoice.']}; }

  // 1. Vendor must be the same
  if(inv.vendor_id !== po.vendor_id){
    reasons.push('Invoice vendor does not match the PO vendor.');
  }

  // 2. Amount comparison (allow ₹1 rounding tolerance)
  const invTotal = Number(inv.total_amount)||0;
  const poTotal = Number(po.total_amount)||0;
  const diff = +(invTotal - poTotal).toFixed(2);
  if(Math.abs(diff) <= 1){
    // amounts align
  } else if(invTotal < poTotal){
    reasons.push(`Invoice total ${fmtMoney(invTotal)} is less than PO total ${fmtMoney(poTotal)} (short by ${fmtMoney(Math.abs(diff))}) — likely a partial/part-delivery invoice.`);
  } else {
    reasons.push(`Invoice total ${fmtMoney(invTotal)} exceeds PO total ${fmtMoney(poTotal)} (over by ${fmtMoney(diff)}).`);
  }

  // 3. Taxable/tax split comparison if available
  if(inv.amount !== undefined && po.subtotal !== undefined){
    const invBase = Number(inv.amount)||0, poBase = Number(po.subtotal)||0;
    if(Math.abs(invBase - poBase) > 1){
      reasons.push(`Taxable value differs: invoice ${fmtMoney(invBase)} vs PO ${fmtMoney(poBase)}.`);
    }
  }
  if(inv.tax_amount !== undefined && po.tax_amount !== undefined){
    const it = Number(inv.tax_amount)||0, pt = Number(po.tax_amount)||0;
    if(Math.abs(it - pt) > 1){
      reasons.push(`Tax amount differs: invoice ${fmtMoney(it)} vs PO ${fmtMoney(pt)}.`);
    }
  }

  // Decide overall status
  if(reasons.length === 0) return {status:'matched', reasons:['Invoice total, taxable value and tax match the PO.']};

  const onlyAmountDiff = reasons.every(r => r.includes('less than') || r.includes('exceeds') || r.includes('Taxable value differs') || r.includes('Tax amount differs'));
  const vendorMismatch = reasons.some(r => r.includes('vendor'));
  if(vendorMismatch) return {status:'unmatched', reasons};
  // amount differences → partial; big overage could be treated stricter but we flag as partial with reason
  return {status: onlyAmountDiff ? 'partial' : 'unmatched', reasons};
}
function matchBadge(status){
  const map = {matched:'badge-approved', partial:'badge-submitted', unmatched:'badge-rejected'};
  const label = {matched:'MATCHED', partial:'PARTIALLY MATCHED', unmatched:'UNMATCHED'};
  return `<span class="badge ${map[status]}">${label[status]}</span>`;
}

// Admin revises an already-decided invoice; logged to the audit trail.
async function changeInvoiceDecision(id, newStatus){
  if(blockedReadOnly()) return;
  const reason = (document.getElementById('inv-change-reason')||{}).value?.trim() || null;
  if(!reason){ toast('Please enter a reason for the change', true); return; }
  const { data: inv } = await sb.from('invoices').select('status, invoice_number').eq('id', id).single();
  const oldStatus = inv.status;
  // reset approval level if re-opened
  const patch = { status: newStatus };
  if(newStatus==='submitted') patch.current_approval_level = 1;
  const { error } = await sb.from('invoices').update(patch).eq('id', id);
  if(error){ toast(error.message, true); return; }
  // write to the approvals audit log
  await sb.from('approvals').insert({
    invoice_id: id, approver_id: state.profile.id, level: 0,
    action: newStatus, comments: `[DECISION CHANGED from ${oldStatus}] ${reason}`
  }).then(()=>{}, ()=>{});
  await logActivity(state.company.id, 'invoice_decision_changed', 'invoice', id, {from: oldStatus, to: newStatus, reason});
  closeModal(); toast(`Decision changed to ${newStatus}`); renderCompanyApp('invoices');
}
async function actOnInvoice(id, action){
  const comments = document.getElementById('inv-comments').value;
  const { data: inv } = await sb.from('invoices').select('*').eq('id', id).single();
  const levels = state.company.approval_levels || 1;

  await sb.from('approvals').insert({
    invoice_id: id, approver_id: state.profile.id, level: inv.current_approval_level, action, comments
  });

  if(action === 'rejected'){
    await sb.from('invoices').update({status:'rejected', rejection_reason: comments}).eq('id', id);
  } else {
    if(inv.current_approval_level >= levels){
      await sb.from('invoices').update({status:'approved'}).eq('id', id);
    } else {
      await sb.from('invoices').update({status:'under_review', current_approval_level: inv.current_approval_level+1}).eq('id', id);
    }
  }
  await logActivity(state.company.id, `invoice_${action}`, 'invoice', id, {comments});
  closeModal(); toast('Recorded'); renderCompanyApp('invoices');
}

// ---- One-click inline approval (no modal) ----
async function quickApprove(id){
  if(blockedReadOnly()) return;
  const { data: inv } = await sb.from('invoices').select('*, purchase_orders(*)').eq('id', id).single();
  const levels = state.company.approval_levels || 1;
  const m = matchInvoiceToPO(inv, inv.purchase_orders);
  // If mismatched, confirm once (single extra click only when it matters).
  if(m.status !== 'matched'){
    if(!confirm(`This invoice is ${m.status} against its PO:\n\n${m.reasons.join('\n')}\n\nApprove anyway?`)) return;
  }
  const comments = m.status==='matched' ? 'Approved (matched)' : `Approved despite ${m.status}: ${m.reasons.join('; ')}`;
  await sb.from('approvals').insert({ invoice_id:id, approver_id:state.profile.id, level:inv.current_approval_level, action:'approved', comments }).then(()=>{},()=>{});
  if(inv.current_approval_level >= levels){
    await sb.from('invoices').update({status:'approved'}).eq('id', id);
  } else {
    await sb.from('invoices').update({status:'under_review', current_approval_level: inv.current_approval_level+1}).eq('id', id);
  }
  await logActivity(state.company.id, 'invoice_approved', 'invoice', id, {inline:true, match:m.status});
  toast('Approved'); renderCompanyApp('invoices');
}
async function quickReject(id){

  await sb.from('approvals').insert({ invoice_id:id, approver_id:state.profile.id, level:inv.current_approval_level, action:'rejected', comments:reason }).then(()=>{},()=>{});

  await logActivity(state.company.id, 'invoice_rejected', 'invoice', id, {inline:true, reason});

}
// Approve every matched invoice awaiting this user — bulk, one click.
async function approveAllMatched(){
  if(blockedReadOnly()) return;
  const { data: invs } = await sb.from('invoices').select('*, purchase_orders(*)').eq('company_id',state.company.id);
  const levels = state.company.approval_levels || 1;
  const targets = (invs||[]).filter(i=>['submitted','under_review'].includes(i.status) &&
    (state.role==='company_admin' || (state.role==='approver' && state.profile.approval_level===i.current_approval_level)) &&
    matchInvoiceToPO(i, i.purchase_orders).status==='matched');
  if(!targets.length){ toast('No fully-matched invoices to approve', true); return; }
  if(!confirm(`Approve ${targets.length} fully-matched invoice(s) awaiting you? Mismatched ones are skipped and stay for individual review.`)) return;
  for(const inv of targets){
    await sb.from('approvals').insert({ invoice_id:inv.id, approver_id:state.profile.id, level:inv.current_approval_level, action:'approved', comments:'Approved (matched, bulk)' }).then(()=>{},()=>{});
    if(inv.current_approval_level >= levels){
      await sb.from('invoices').update({status:'approved'}).eq('id', inv.id);
    } else {
      await sb.from('invoices').update({status:'under_review', current_approval_level: inv.current_approval_level+1}).eq('id', inv.id);
    }
    await logActivity(state.company.id, 'invoice_approved', 'invoice', inv.id, {bulk:true});
  }
  toast(`Approved ${targets.length} invoice(s)`); renderCompanyApp('invoices');
}

async function saveVendorProfile(){

async function uploadVendorDoc(kind){
  const map = {
    cheque: { input:'vp-file-cheque', col:'cancelled_cheque_path', label:'cheque' },
    gst:    { input:'vp-file-gst',    col:'gst_certificate_path',   label:'GST certificate' },
    inc:    { input:'vp-file-inc',    col:'incorporation_cert_path',label:'incorporation certificate' }
  };
  const cfg = map[kind];
  const msg = document.getElementById('vp-doc-msg');
  msg.style.color = 'var(--red)';
  const file = document.getElementById(cfg.input).files[0];
  if(!file){ msg.textContent = 'Choose a file first.'; return; }
  if(file.size > 50*1024*1024){ msg.textContent = 'File exceeds 50 MB.'; return; }
  msg.style.color = 'var(--ink-soft)';
  msg.textContent = 'Uploading…';
  // Sanitise filename — Supabase storage rejects spaces and special chars.
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const ext = safeName.includes('.') ? safeName.split('.').pop() : 'dat';
  const path = `${state.profile.id}/${kind}_${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('vendor-docs').upload(path, file, { upsert:true, contentType: file.type || 'application/octet-stream' });
  if(upErr){
    msg.style.color = 'var(--red)';
    msg.textContent = 'Upload failed: ' + upErr.message + '. If this mentions a bucket or permission, the vendor-docs storage setup may be missing — see migration_vendor_kyc.sql.';
    return;
  }
  const { error: dbErr } = await sb.from('vendors').update({ [cfg.col]: path }).eq('id', state.profile.id);
  if(dbErr){ msg.style.color='var(--red)'; msg.textContent = 'File uploaded but couldn\'t record it: '+dbErr.message; return; }
  state.profile[cfg.col] = path;
  msg.style.color = 'var(--green)';
  msg.textContent = cfg.label.charAt(0).toUpperCase()+cfg.label.slice(1)+' uploaded successfully.';
  loadVendorDocLinks();
}
async function loadVendorDocLinks(){
  const items = [
    { col:'cancelled_cheque_path', el:'vp-link-cheque' },
    { col:'gst_certificate_path',  el:'vp-link-gst' },
    { col:'incorporation_cert_path', el:'vp-link-inc' }
  ];
  for(const it of items){
    const el = document.getElementById(it.el);
    if(!el) continue;
    const p = state.profile[it.col];
    if(!p){ el.textContent = 'Not uploaded'; continue; }
    const { data } = await sb.storage.from('vendor-docs').createSignedUrl(p, 3600);
    el.innerHTML = data?.signedUrl ? `<a href="${data.signedUrl}" target="_blank">View uploaded file →</a>` : 'Uploaded';
  }
}

    // map PO numbers

      (pos||[]).forEach(p=>{ poMap[p.id] = p.po_number; });
    }
    const totalHeld = (invs||[]).reduce((s,i)=>s+totalHold(i),0);
    const heldBanner = totalHeld > 0

          <strong>${fmtMoney(totalHeld)} currently on hold</strong> across your invoices. See the "Held" column for the amount and reason on each. GST amounts are typically released once your invoice reflects in the buyer's GSTR-2B (i.e. after you file your GSTR-1).

async function runVendorReport(vid){
  const type = (document.getElementById('vrep-type')||{}).value || state.reportType || 'statement';
  state.reportType = type;
  state.reportFrom = (document.getElementById('vrep-from')||{}).value || '';
  state.reportTo = (document.getElementById('vrep-to')||{}).value || '';
  const from = state.reportFrom, to = state.reportTo;
  let headers=[], rows=[], summary='', moneyCols=[], title='';
  if(type==='statement'){
    const { data: invs } = await sb.from('invoices').select('*, purchase_orders(po_number)').eq('vendor_id',vid);
    const list=(invs||[]).filter(i=>inRange(i.submitted_at,from,to)).sort((a,b)=>new Date(b.submitted_at)-new Date(a.submitted_at));
    headers=['Invoice #','PO','Total','Paid','Held','Due','Status','Date'];
    rows=list.map(i=>{const t=Number(i.total_amount||0),p=amountPaidEff(i),h=i.status==='paid'?0:totalHold(i);return [i.invoice_number,i.purchase_orders?.po_number||'',t.toFixed(2),p.toFixed(2),h.toFixed(2),amountDue(i).toFixed(2),i.status,fmtDate(i.submitted_at)];});
    moneyCols=[2,3,4,5]; title='Invoice statement';
    summary=`${list.length} invoice(s)`;
  } else if(type==='payments'){
    const { data: pays } = await sb.from('payments').select('*, invoices(invoice_number)').eq('vendor_id',vid);
    const list=(pays||[]).filter(p=>inRange(p.paid_on,from,to)).sort((a,b)=>new Date(b.paid_on)-new Date(a.paid_on));
    headers=['Date','Invoice #','Amount','Reference'];
    rows=list.map(p=>[fmtDate(p.paid_on),p.invoices?.invoice_number||'',Number(p.amount).toFixed(2),p.reference||'']);
    moneyCols=[2]; title='Payments received';
    summary=`Total received: ${fmtMoney(list.reduce((s,p)=>s+Number(p.amount),0))}`;
  } else {
    const { data: invs } = await sb.from('invoices').select('*, purchase_orders(po_number)').eq('vendor_id',vid);
    const list=(invs||[]).filter(i=>inRange(i.submitted_at,from,to)).map(i=>{const h=i.status==='paid'?0:totalHold(i);return {...i,_due:amountDue(i),_held:h};}).filter(x=>x._due>0.01);
    headers=['Invoice #','PO','Due','Held','Hold reason','Date'];
    rows=list.map(x=>[x.invoice_number,x.purchase_orders?.po_number||'',x._due.toFixed(2),x._held.toFixed(2),x.manual_hold_reason||(itcOnHold(x)>0?'GST awaiting GSTR-2B':''),fmtDate(x.submitted_at)]);
    moneyCols=[2,3]; title='Outstanding / due to me';
    summary=`Total outstanding: ${fmtMoney(list.reduce((s,x)=>s+x._due,0))}`;
  }
  state.__reportData={type,headers,rows,title,moneyCols};
  renderReportTable(headers, rows, summary, title, moneyCols);
}

  const invoice_date = document.getElementById('ui-date').value;
  const amount = parseFloat(document.getElementById('ui-amount').value)||0;
  const tax_amount = parseFloat(document.getElementById('ui-tax').value)||0;
  const file = document.getElementById('ui-file').files[0];
  if(!invoice_number || !invoice_date || !amount || !file){ msg.textContent = 'All fields and a file are required.'; return; }

  msg.style.color = 'var(--ink-soft)';
  msg.textContent = 'Uploading…';
  // Sanitise filename — Supabase storage rejects spaces and special characters,
  // which would make the upload fail and abort the whole submit.
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const ext = safeName.includes('.') ? safeName.split('.').pop() : 'dat';
  const path = `${state.profile.id}/${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('invoices').upload(path, file, { upsert:true, contentType: file.type||'application/octet-stream' });
  if(upErr){ msg.style.color='var(--red)'; msg.textContent = 'File upload failed: '+upErr.message; return; }

  const gst = tax_amount;
  const { data, error } = await sb.from('invoices').insert({
    company_id: state.company.id, po_id: poId, vendor_id: state.profile.id,
    invoice_number, invoice_date, file_path: path, amount, tax_amount,
    total_amount: amount+tax_amount, status:'submitted', current_approval_level: 1,
    gst_amount: gst, taxable_value: amount, amount_paid: 0
  }).select().single();
  if(error){ msg.style.color='var(--red)'; msg.textContent = 'Could not save invoice: '+error.message; return; }
  await logActivity(state.company.id, 'uploaded_invoice', 'invoice', data.id, {invoice_number});
  closeModal(); toast('Invoice submitted for approval'); renderVendorApp('invoices');
}

// ============================================================
// MODAL HELPERS
// ============================================================
function showModal(innerHtml, wide){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'active-modal-bg';
  bg.innerHTML = `<div class="modal${wide?' wide':''}">${innerHtml}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){
  const el = document.getElementById('active-modal-bg');
  if(el) el.remove();
}

// ============================================================
// GO
// ============================================================
function startApp(){
  if(typeof supabase === 'undefined'){
    document.getElementById('root').innerHTML = `
    <div class="login-wrap"><div class="card login-card" style="width:480px;margin:40px auto;">
      <h2 style="margin-top:0;color:var(--red);">Couldn't load a required library</h2>
      <p>The Supabase library couldn't be loaded from any CDN. This is usually a network or firewall issue blocking cdn.jsdelivr.net, unpkg.com and skypack.dev.</p>
      <p class="muted">Try a different network (e.g. mobile data), disable any ad-blocker/firewall for this site, then reload. If it persists, your ISP may be blocking these CDNs.</p>
      <button class="btn btn-primary" style="margin-top:10px;" onclick="location.reload()">Reload</button>
    </div></div>`;
    return;
  }
  // create the client now that the library is present
  try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e){}
  if(sb){
    sb.auth.onAuthStateChange((event, session) => {
      state.session = session;
      if(event === 'PASSWORD_RECOVERY'){
        showResetPasswordForm();
      }
    });
    boot();
  } else {
    boot(); // will render the CONFIG_ERROR message
  }
}
// Kick off: load libraries (with CDN fallback), then start.
if(window.__loadLibs){
  window.__loadLibs(function(){ startApp(); });
} else {
  startApp();
}
</script>
