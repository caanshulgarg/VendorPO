<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kiyra — PO & Vendor Invoice Management</title>
<script>
// Resilient library loader: try jsDelivr first, fall back to unpkg if a CDN
// is blocked (some ISPs block jsDelivr). Prevents a blank page on CDN failure.
(function(){
  function loadScript(urls, done){
    var i = 0;
    function attempt(){
      if(i >= urls.length){ done && done(new Error('all CDNs failed')); return; }
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = function(){ done && done(null); };
      s.onerror = function(){ attempt(); };
      document.head.appendChild(s);
    }
    attempt();
  }
  window.__loadLibs = function(cb){
    loadScript([
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
      'https://unpkg.com/@supabase/supabase-js@2',
      'https://cdn.skypack.dev/@supabase/supabase-js@2'
    ], function(err){
      // load xlsx too (non-critical — app still works without it, exports degrade)
      loadScript([
        'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
        'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
      ], function(){ cb(err); });
    });
  };
})();
</script>
<style>
  /* ============================================================
     Kiyra — professional SaaS dashboard
     Corporate blue, clean white cards, restrained accents.
     Trustworthy, calm, built for finance teams.
     ============================================================ */
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --bg:#f4f6f9;            /* cool light grey */
    --card:#ffffff;
    --border:#e3e8ef;
    --border-strong:#cdd5e0;
    --ink:#1b2a3d;           /* deep slate-navy text */
    --ink-soft:#5b6b7f;
    --text:#1b2a3d;
    --muted:#8494a6;
    --primary:#1e5fbf;       /* corporate blue */
    --primary-dark:#164a99;
    --primary-soft:#e8f0fb;
    --primary-grad:linear-gradient(135deg,#1e5fbf 0%,#2b7de0 100%);
    --green:#0f9d58;
    --green-soft:#e6f5ee;
    --red:#d92d20;
    --red-soft:#fdecea;
    --amber:#e08600;
    --amber-soft:#fdf2e3;
    --blue:#1e5fbf;
    --blue-soft:#e8f0fb;
    --radius:12px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(27,42,61,0.05), 0 3px 12px -6px rgba(27,42,61,0.10);
    --shadow-md:0 4px 20px -8px rgba(27,42,61,0.16);
    --shadow-lg:0 12px 36px -12px rgba(27,42,61,0.22);
    --num:'Inter';
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;}
  .app{max-width:1220px;margin:0 auto;padding:26px 24px 60px;}

  /* top chrome */
  header.topbar{display:flex;justify-content:space-between;align-items:center;padding:0 24px;height:62px;background:#fff;color:var(--ink);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border);box-shadow:0 1px 3px rgba(20,23,45,0.03);}
  header.topbar h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;margin:0;letter-spacing:-0.02em;color:var(--ink);display:flex;align-items:center;gap:9px;}
  header.topbar h1::before{content:'';width:26px;height:26px;border-radius:7px;background:var(--primary);box-shadow:0 2px 6px -1px rgba(30,95,191,0.4);flex-shrink:0;}
  header.topbar h1 .mark{color:var(--primary);}
  header.topbar .who{font-size:12.5px;color:var(--ink-soft);letter-spacing:0.01em;}
  header.topbar .btn{background:var(--card);color:var(--ink);border:1px solid var(--border-strong);}
  header.topbar .btn:hover{background:var(--bg);border-color:var(--primary);color:var(--primary);}

  /* buttons */
  .btn{padding:9px 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--card);cursor:pointer;font-size:13.5px;font-weight:600;font-family:inherit;color:var(--ink);transition:all .15s ease;line-height:1.1;}
  .btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
  .btn-primary{background:var(--primary);color:#fff !important;border:1px solid var(--primary);box-shadow:0 1px 3px rgba(30,95,191,0.25);}
  .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff !important;box-shadow:0 2px 8px -1px rgba(30,95,191,0.35);}
  .btn-danger{background:#fff;color:var(--red);border:1px solid #f3c6d2;}
  .btn-danger:hover{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  .btn-green{background:var(--green);color:#fff !important;border:1px solid var(--green);box-shadow:0 2px 8px -2px rgba(22,163,74,0.45);}
  .btn-green:hover{background:#12833c;color:#fff !important;transform:translateY(-1px);}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;font-weight:600;box-shadow:none;}
  /* icon action buttons for inline row actions */
  .btn-icon{width:30px;height:30px;padding:0;border-radius:8px;border:1px solid var(--border-strong);background:#fff;cursor:pointer;font-size:14px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:all .13s;color:var(--ink-soft);vertical-align:middle;}
  .btn-icon:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
  .btn-icon-green{color:var(--green);border-color:#bfe3cf;background:var(--green-soft);}
  .btn-icon-green:hover{background:var(--green);color:#fff;border-color:var(--green);}
  .btn-icon-red{color:var(--red);border-color:#f3c4bf;background:var(--red-soft);}
  .btn-icon-red:hover{background:var(--red);color:#fff;border-color:var(--red);}
  tr.row-warn{background:#fff9ef;}
  tr.row-warn:hover{background:#fef3e0;}
  tr.row-warn td:first-child{box-shadow:inset 3px 0 0 var(--amber);}
  /* row action menu popover */
  .row-menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;min-width:150px;}
  .row-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;font-size:13px;border-radius:7px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .row-menu button:hover{background:var(--primary-soft);color:var(--primary);}
  .gst2b-link{cursor:pointer;display:inline-flex;align-items:center;gap:2px;padding:2px 4px;border-radius:6px;transition:background .12s;}
  .gst2b-link:hover{background:var(--primary-soft);}

  /* cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow);transition:box-shadow .18s;}
  .card:hover{box-shadow:var(--shadow-md);}
  .card h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:17px;letter-spacing:-0.01em;}
  .grid{display:grid;gap:18px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}

  /* forms */
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:10px;font-size:14px;margin-top:5px;background:#fff;font-family:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
  label{font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.05em;}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:12px 12px;border-bottom:1px solid var(--border);}
  th{color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;background:var(--bg);}
  th:first-child{border-top-left-radius:8px;}
  th:last-child{border-top-right-radius:8px;}
  tbody tr{transition:background .12s;}
  tbody tr:hover{background:var(--primary-soft);}

  /* badges */
  .badge{padding:3px 11px;border-radius:99px;font-size:10.5px;font-weight:700;display:inline-block;letter-spacing:.03em;text-transform:uppercase;border:1px solid transparent;}
  .badge-draft{background:#eef0f6;color:#6b7186;}
  .badge-sent{background:var(--blue-soft);color:var(--blue);}
  .badge-pending_approval{background:var(--amber-soft);color:#b26f04;}
  .badge-acknowledged{background:var(--blue-soft);color:var(--blue);}
  .badge-closed{background:#eef0f6;color:#6b7186;}
  .badge-cancelled{background:var(--red-soft);color:var(--red);}
  .badge-submitted{background:var(--amber-soft);color:#b26f04;}
  .badge-under_review{background:var(--amber-soft);color:#b26f04;}
  .badge-approved{background:var(--green-soft);color:var(--green);}
  .badge-rejected{background:var(--red-soft);color:var(--red);}
  .badge-paid{background:#e8eef8;color:#2f4a80;}
  .badge-active{background:#e2efea;color:#0f6f5c;}
  .badge-pending{background:#f7efe0;color:#8a6420;}
  .badge-disabled,.badge-suspended{background:#f8eded;color:#a33;}

  /* tabs */
  /* ---- Sidebar layout ---- */
  .layout{display:flex;min-height:calc(100vh - 60px);}
  .sidebar{width:216px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;}
  .sidebar .navlink{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:3px;transition:all .14s;}
  .sidebar .navlink:hover{background:var(--primary-soft);color:var(--primary);}
  .sidebar .navlink.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px -2px rgba(30,95,191,0.4);}
  .sidebar .navlink.active:hover{color:#fff;}
  .main-content{flex:1;min-width:0;max-width:1220px;margin:0 auto;padding:26px 24px 60px;width:100%;}
  .hamburger{display:none;background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16);border-radius:7px;width:38px;height:34px;font-size:18px;cursor:pointer;align-items:center;justify-content:center;}
  .sidebar-backdrop{display:none;position:fixed;inset:60px 0 0 0;background:rgba(0,0,0,0.35);z-index:39;}

  @media(max-width:820px){
    .hamburger{display:flex;}
    .sidebar{position:fixed;top:60px;left:0;z-index:40;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 16px rgba(0,0,0,0.12);}
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.open{display:block;}
    .main-content{padding:18px 14px 50px;}
  }

  .tabs{display:none;} /* legacy horizontal tabs hidden; sidebar used instead */

  /* login */
  .login-wrap{display:flex;min-height:100vh;background:var(--bg);}
  .login-brand{flex:1;background:linear-gradient(150deg,#164a99 0%,#1e5fbf 55%,#2b7de0 100%);color:#fff;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .login-brand::after{content:'';position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,0.06);}
  .login-brand::before{content:'';position:absolute;right:40px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,0.05);}
  .login-brand .lb-logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
  .login-brand .lb-logo::before{content:'';width:30px;height:30px;border-radius:8px;background:#fff;}
  .login-brand h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-0.02em;margin:0 0 16px;position:relative;z-index:1;}
  .login-brand p{font-size:15px;line-height:1.6;color:rgba(255,255,255,0.85);max-width:400px;position:relative;z-index:1;}
  .login-brand .lb-feats{list-style:none;padding:0;margin:22px 0 0;position:relative;z-index:1;}
  .login-brand .lb-feats li{display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(255,255,255,0.92);margin-bottom:12px;}
  .login-brand .lb-feats li::before{content:'✓';display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,0.18);font-size:12px;font-weight:700;flex-shrink:0;}
  .login-brand .lb-foot{font-size:12.5px;color:rgba(255,255,255,0.7);position:relative;z-index:1;}
  .login-form-side{width:480px;max-width:100%;display:flex;align-items:center;justify-content:center;padding:40px 44px;}
  .login-form-inner{width:100%;max-width:360px;}
  .login-card h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.02em;}
  @media(max-width:860px){ .login-brand{display:none;} .login-form-side{width:100%;} }
  .auth-tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:11px;}
  .auth-tab{flex:1;text-align:center;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:all .14s;}
  .auth-tab:hover{color:var(--ink);}
  .auth-tab.active{background:#fff;color:var(--primary);box-shadow:var(--shadow);}
  .brand-lockup{display:flex;align-items:baseline;gap:2px;}

  /* stats / KPI */
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .muted{color:var(--muted);font-size:13px;}
  .stat{font-size:30px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);line-height:1.1;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s;}
  .kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .kpi .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;margin-bottom:10px;}
  .kpi .kpi-value{font-size:29px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-0.025em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1;}
  .kpi .kpi-sub{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .kpi .kpi-accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);}
  .kpi.amber .kpi-accent{background:var(--amber);}
  .kpi.blue .kpi-accent{background:var(--blue);}
  .kpi.red .kpi-accent{background:var(--red);}
  .kpi.green .kpi-accent{background:var(--green);}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(16,24,34,0.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:14px;padding:26px;width:460px;max-width:94vw;max-height:88vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,0.5);}
  .modal.wide{width:880px;}
  .modal h3{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:20px;letter-spacing:-0.01em;margin-top:0;}
  .close-x{float:right;cursor:pointer;color:var(--ink-soft);font-size:16px;line-height:1;}
  .close-x:hover{color:var(--ink);}

  /* toast */
  .toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:13px 20px;border-radius:10px;font-size:14px;z-index:100;box-shadow:0 12px 32px -8px rgba(0,0,0,0.4);animation:toastIn .2s ease;}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* PO item rows */
  .item-row{display:grid;grid-template-columns:3fr 1fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px;}
  .item-row input{padding:8px;font-size:13px;margin-top:0;min-width:0;}

  /* simple bar chart (analytics) */
  .barchart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px;}
  .barchart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .barchart .bar{width:100%;max-width:46px;background:linear-gradient(180deg,#159e83,#0f6f5c);border-radius:5px 5px 0 0;min-height:2px;transition:height .5s cubic-bezier(.2,.8,.2,1);}
  .barchart .bar-label{font-size:10.5px;color:var(--ink-soft);text-align:center;font-weight:500;}
  .barchart .bar-val{font-size:11px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}

  /* donut legend */
  .legend-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:7px;}
  .legend-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}

  /* section eyebrow */
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);font-weight:700;margin-bottom:8px;display:inline-block;}

  .hidden{display:none;}
  a{color:var(--primary);text-decoration:none;}
  a:hover{text-decoration:underline;}
  code{background:#eceee9;padding:2px 7px;border-radius:5px;font-size:13px;font-family:'Inter';}

  /* ---- Universal filter bar ---- */
  .filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;}
  .filterbar .fb-search{flex:1;min-width:180px;}
  .filterbar input,.filterbar select{margin-top:0;padding:8px 10px;font-size:13px;background:#fff;}
  .filterbar .fb-group{display:flex;flex-direction:column;gap:2px;}
  .filterbar .fb-label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:600;}
  .filterbar .fb-clear{align-self:flex-end;font-size:12px;color:var(--primary);cursor:pointer;background:none;border:none;padding:8px 4px;font-weight:600;}
  .filterbar .fb-clear:hover{text-decoration:underline;}
  .fb-count{font-size:12px;color:var(--ink-soft);margin:6px 2px 0;}
  tr.fb-hidden{display:none;}

  /* ITC / 2B badges */
  .badge-reflected{background:var(--green-soft);color:var(--green);}
  .badge-not_reflected{background:var(--red-soft);color:var(--red);}
  .badge-pending2b{background:var(--amber-soft);color:#b26f04;}

  @media(max-width:820px){
    .grid-3,.grid-4{grid-template-columns:1fr 1fr;}
    .app{padding:18px 14px 50px;}
  }
  @media(max-width:520px){
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="root"></div>
<div id="toast-holder"></div>

<script>
// ============================================================
// CONFIG — fill these in with your Supabase project details
// ============================================================
const SUPABASE_URL = "https://dqsygmahfyvrxwpdyqcv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxc3lnbWFoZnl2cnh3cGR5cWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzI3MTksImV4cCI6MjEwMjU0ODcxOX0.5fY0In_MQncov1DEaWFH9VONS8i2HoGSk5Ps0m4ytQs";

let sb = null;
let CONFIG_ERROR = null;

function isValidHttpUrl(str){
  try {
    const u = new URL(str);
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch(e){ return false; }
}

if(!SUPABASE_URL || SUPABASE_URL === "YOUR_SUPABASE_URL" || !isValidHttpUrl(SUPABASE_URL)){
  CONFIG_ERROR = `SUPABASE_URL is missing or invalid: "${SUPABASE_URL}". It must look like https://xxxxxxxx.supabase.co (from Supabase → Settings → API → Project URL).`;
} else if(!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY" || SUPABASE_ANON_KEY.length < 20){
  CONFIG_ERROR = `SUPABASE_ANON_KEY is missing or looks invalid. Copy the "anon public" key from Supabase → Settings → API.`;
} else {
  // Client is created later in startApp(), after the Supabase library has loaded
  // (it loads asynchronously with CDN fallback). Just validate config here.
}

function renderConfigError(){
  document.getElementById('root').innerHTML = `
  <div class="login-wrap">
    <div class="card login-card" style="width:480px;">
      <h2 style="margin-top:0;color:var(--red);">Setup needed</h2>
      <p>${CONFIG_ERROR}</p>
      <p class="muted">Open index.html, find the two lines near the top of the &lt;script&gt; tag (SUPABASE_URL and SUPABASE_ANON_KEY), and paste in your real values from your Supabase project's Settings → API page. Then re-save/re-upload the file.</p>
    </div>
  </div>`;
}

// Creates a brand-new, isolated Supabase client (its own auth state, not persisted
// to localStorage) purely for signing up OTHER users (company admins, team members).
// This is necessary because calling auth.signUp() on the main `sb` client would
// switch the CURRENT logged-in session over to the newly created user — which is
// exactly what we don't want when a superadmin/admin is creating someone else's login.
function scratchClient(){
  return supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });
}

function toast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.background = '#b91c1c';
  el.textContent = msg;
  document.getElementById('toast-holder').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

function fmtMoney(n){
  return '₹' + Number(n||0).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '-';
  return new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(d){
  if(!d) return '-';
  return new Date(d).toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

// ============================================================
// UNIVERSAL FILTER SYSTEM
// Renders a filter bar (search + dropdowns) above a table and
// filters the table's rows live in the browser. No server calls.
//
// buildFilterBar(id, config) returns HTML for the bar.
// config = {
//   search: true,                       // show free-text search box
//   selects: [                          // dropdown filters
//     { key:'status', label:'Status', options:['sent','closed',...] }
//   ]
// }
// Each table row must carry data attributes matching the select keys,
// e.g. <tr data-status="sent" data-vendor="ABC" data-search="all text">.
// The search box matches against data-search (a lowercased blob).
// ============================================================
function buildFilterBar(tableId, config){
  const parts = [];
  if(config.search !== false){
    parts.push(`<div class="fb-group fb-search">
      <span class="fb-label">Search</span>
      <input type="text" id="fb-${tableId}-search" placeholder="Type to filter…" oninput="applyFilters('${tableId}')"/>
    </div>`);
  }
  (config.selects||[]).forEach(sel=>{
    const opts = ['<option value="">All</option>']
      .concat(sel.options.map(o=>{
        const val = typeof o === 'object' ? o.value : o;
        const lab = typeof o === 'object' ? o.label : o.replace(/_/g,' ');
        return `<option value="${val}">${lab}</option>`;
      })).join('');
    parts.push(`<div class="fb-group">
      <span class="fb-label">${sel.label}</span>
      <select id="fb-${tableId}-${sel.key}" data-key="${sel.key}" onchange="applyFilters('${tableId}')">${opts}</select>
    </div>`);
  });
  if(config.amount){
    parts.push(`<div class="fb-group"><span class="fb-label">Min ₹</span>
      <input type="number" id="fb-${tableId}-amtmin" style="width:100px;" placeholder="0" oninput="applyFilters('${tableId}')"/></div>`);
    parts.push(`<div class="fb-group"><span class="fb-label">Max ₹</span>
      <input type="number" id="fb-${tableId}-amtmax" style="width:100px;" placeholder="∞" oninput="applyFilters('${tableId}')"/></div>`);
  }
  parts.push(`<button class="fb-clear" onclick="clearFilters('${tableId}')">Clear</button>`);
  return `<div class="filterbar">${parts.join('')}</div><div class="fb-count" id="fb-${tableId}-count"></div>`;
}

function applyFilters(tableId){
  const table = document.getElementById(tableId);
  if(!table) return;
  const searchEl = document.getElementById(`fb-${tableId}-search`);
  const search = searchEl ? searchEl.value.trim().toLowerCase() : '';
  const amtMinEl = document.getElementById(`fb-${tableId}-amtmin`);
  const amtMaxEl = document.getElementById(`fb-${tableId}-amtmax`);
  const amtMin = amtMinEl && amtMinEl.value !== '' ? parseFloat(amtMinEl.value) : null;
  const amtMax = amtMaxEl && amtMaxEl.value !== '' ? parseFloat(amtMaxEl.value) : null;
  // collect active selects
  const selects = Array.from(table.parentElement.querySelectorAll(`select[id^="fb-${tableId}-"]`));
  const rows = Array.from(table.querySelectorAll('tbody tr, tr')).filter(r=>r.querySelector('td'));
  let shown = 0;
  rows.forEach(row=>{
    let visible = true;
    // free-text search against data-search
    if(search){
      const blob = (row.getAttribute('data-search')||row.textContent||'').toLowerCase();
      if(!blob.includes(search)) visible = false;
    }
    // dropdown filters
    if(visible){
      for(const sel of selects){
        const key = sel.getAttribute('data-key');
        const want = sel.value;
        if(want){
          const have = row.getAttribute('data-'+key) || '';
          if(have !== want){ visible = false; break; }
        }
      }
    }
    // amount range against data-amount
    if(visible && (amtMin !== null || amtMax !== null)){
      const amt = parseFloat(row.getAttribute('data-amount')||'0');
      if(amtMin !== null && amt < amtMin) visible = false;
      if(amtMax !== null && amt > amtMax) visible = false;
    }
    row.classList.toggle('fb-hidden', !visible);
    if(visible) shown++;
  });
  const countEl = document.getElementById(`fb-${tableId}-count`);
  if(countEl) countEl.textContent = `Showing ${shown} of ${rows.length}`;
}

function clearFilters(tableId){
  const wrap = document.getElementById(tableId).parentElement;
  wrap.querySelectorAll(`[id^="fb-${tableId}-"]`).forEach(el=>{
    if(el.tagName === 'INPUT') el.value = '';
    if(el.tagName === 'SELECT') el.value = '';
  });
  applyFilters(tableId);
}

// GSTR-2B / ITC helpers
function gstr2bBadge(status){
  const map = { reflected:'reflected', not_reflected:'not_reflected', pending:'pending2b' };
  const label = { reflected:'Matched', not_reflected:'Unmatched', pending:'Not checked' };
  const s = status || 'pending';
  return `<span class="badge badge-${map[s]}">${label[s]}</span>`;
}
// GST amount considered "on hold" — the unpaid balance when not reflected in 2B.
// If the invoice is reflected in 2B, nothing is held on GST grounds.
// Otherwise the held amount is the still-unpaid balance, capped at the GST amount.
function itcOnHold(inv){
  const st = inv.gstr2b_status || 'pending';
  if(st === 'reflected') return 0;
  const gst = Number(inv.gst_amount || 0);
  const total = Number(inv.total_amount || 0);
  const paid = Number(inv.amount_paid || 0);
  const balance = Math.max(0, total - paid);
  return gst > 0 ? Math.min(balance, gst) : 0;
}
// discretionary hold the company placed for any other reason
function manualHold(inv){
  return Number(inv.manual_hold_amount || 0);
}
// total amount held on this invoice (GST/2B hold + manual hold)
function totalHold(inv){
  return itcOnHold(inv) + manualHold(inv);
}
// Amount still owed on an invoice. If it's marked 'paid', nothing is due
// (guards against older rows where amount_paid wasn't set). Otherwise it's
// total minus what's been paid minus what's on hold.
function amountDue(inv){
  if(inv.status === 'paid') return 0;
  const total = Number(inv.total_amount||0);
  const paid = Number(inv.amount_paid||0);
  const held = totalHold(inv);
  return Math.max(0, total - paid - held);
}
// Effective amount paid — treats a 'paid' invoice as fully paid even if the
// amount_paid column wasn't populated by an older version.
function amountPaidEff(inv){
  if(inv.status === 'paid') return Number(inv.total_amount||0);
  return Number(inv.amount_paid||0);
}

async function boot(){
  if(CONFIG_ERROR){ renderConfigError(); return; }
  // If the user arrived via a password-recovery link, the URL contains a recovery token.
  // Show the reset form instead of the normal app.
  if(window.location.hash.includes('type=recovery')){
    showResetPasswordForm();
    return;
  }
  try{
    const { data: { session } } = await sb.auth.getSession();
    state.session = session;
    if(!session){ renderLogin(); return; }
    await resolveRole();
  } catch(e){
    document.getElementById('root').innerHTML = `
    <div class="login-wrap"><div class="card login-card" style="width:480px;">
      <h2 style="margin-top:0;color:var(--red);">Something went wrong</h2>
      <p>${e.message || e}</p>
      <p class="muted">Open the browser console (F12) for more detail, or check that schema.sql has been run in your Supabase project.</p>
    </div></div>`;
  }
}

// ---- Plan limits ----
async function loadPlanLimits(){
  const planName = (state.company.plan || 'trial').toLowerCase();
  const { data } = await sb.from('plan_limits').select('*').eq('plan', planName).maybeSingle();
  // fall back to a permissive default if the plan row is missing
  state.plan = data || { plan: planName, max_users:null, max_vendors:null, max_docs_per_month:null, max_approval_levels:5, allow_partial_match:true, allow_custom_letterhead:true, allow_auto_email:false, price_monthly:0 };
}
function planAllowsMore(count, limit){
  return limit === null || limit === undefined || count < limit;
}
async function countRows(table){
  const { count } = await sb.from(table).select('id', {count:'exact', head:true}).eq('company_id', state.company.id);
  return count || 0;
}
async function docsThisMonth(){
  const start = new Date(); start.setDate(1); start.setHours(0,0,0,0);
  const iso = start.toISOString();
  const { count: poCount } = await sb.from('purchase_orders').select('id',{count:'exact',head:true}).eq('company_id', state.company.id).gte('created_at', iso);
  const { count: invCount } = await sb.from('invoices').select('id',{count:'exact',head:true}).eq('company_id', state.company.id).gte('submitted_at', iso);
  return (poCount||0) + (invCount||0);
}

async function resolveRole(){
  const uid = state.session.user.id;
  const errors = [];

  // Restore the tab the user was on before a refresh (from the URL hash).
  // Restore the tab the user was on before a refresh (hash first, then sessionStorage backup).
  let hashTab = (location.hash || '').replace('#','').trim() || null;
  if(hashTab && hashTab.includes('=')) hashTab = null; // ignore auth tokens like access_token=...
  if(!hashTab){ try { hashTab = sessionStorage.getItem('kiyra_tab') || null; } catch(e){} }

  let { data: sa, error: saErr } = await sb.from('superadmins').select('*').eq('auth_user_id', uid).maybeSingle();
  if(saErr) errors.push('superadmins: '+saErr.message);
  if(sa){ state.role='superadmin'; state.profile=sa; renderSuperadmin(hashTab); return; }

  let { data: cu, error: cuErr } = await sb.from('company_users').select('*, companies(*)').eq('auth_user_id', uid).maybeSingle();
  if(cuErr) errors.push('company_users: '+cuErr.message);
  if(cu){ state.role = cu.role; state.profile = cu; state.company = cu.companies; await loadPlanLimits(); renderCompanyApp(hashTab); return; }

  let { data: v, error: vErr } = await sb.from('vendors').select('*, companies(*)').eq('auth_user_id', uid).maybeSingle();
  if(vErr) errors.push('vendors: '+vErr.message);
  if(v){ state.role='vendor'; state.profile=v; state.company=v.companies; renderVendorApp(hashTab); return; }

  // logged in but no role row found yet (or a query above errored — surface it so it's diagnosable)
  document.getElementById('root').innerHTML = `<div class="login-wrap"><div class="card login-card" style="width:480px;">
    <p>Your account isn't linked to a company or vendor profile yet.</p>
    <p class="muted">Ask your company admin (or superadmin) to add you.</p>
    ${errors.length ? `<p style="color:var(--red);font-size:12px;margin-top:10px;">Debug info: ${errors.join(' · ')}</p>` : `<p class="muted" style="font-size:12px;margin-top:10px;">Debug: no errors from the database — no matching row was found for this account (auth uid: ${uid}).</p>`}
    <button class="btn" onclick="signOut()">Sign out</button>
  </div></div>`;
}

async function signOut(){
  await sb.auth.signOut();
  state = {session:null, role:null, profile:null, company:null, activeTab:null};
  renderLogin();
}

function switchAuthTab(t){
  ['signin','company','signup'].forEach(k=>{
    const tab = document.getElementById('tab-'+(k==='signin'?'signin':k));
    const panel = document.getElementById('auth-'+k);
    if(tab) tab.classList.toggle('active', k===t);
    if(panel) panel.classList.toggle('hidden', k!==t);
  });
}

async function sendResetEmail(){

  const msg = document.getElementById('fp-msg');
  msg.style.color = 'var(--red)';
  if(!email){ msg.textContent = 'Enter your email.'; return; }
  // The redirect brings the user back to this app with a recovery token in the URL,
  // which onAuthStateChange picks up as a PASSWORD_RECOVERY event.
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname

  msg.style.color = 'var(--green)';
  msg.textContent = 'If an account exists for that email, a reset link has been sent. Check your inbox (and spam).';

async function doVendorSignup(){
  const slug = document.getElementById('signup-slug').value.trim().toLowerCase();
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-pass').value;
  const msg = document.getElementById('signup-msg');
  msg.style.color = 'var(--red)';
  msg.textContent = '';

  if(!slug || !name || !email || !password){ msg.textContent = 'All fields are required.'; return; }
  if(password.length < 6){ msg.textContent = 'Password must be at least 6 characters.'; return; }

  // 1. Find the company by slug (works while logged out, via SECURITY DEFINER function)
  const { data: companies, error: cerr } = await sb.rpc('find_company_by_slug', { p_slug: slug });
  const company = Array.isArray(companies) ? companies[0] : companies;
  if(cerr){ msg.textContent = 'Lookup failed: '+cerr.message; return; }
  if(!company){ msg.textContent = 'No company found with code "'+slug+'". Check the exact code your client gave you.'; return; }
  if(company.status !== 'active'){ msg.textContent = 'That company account is currently suspended — contact them.'; return; }

  // 2. Create the auth account (isolated client so it doesn't disturb any current session)
  const { data: sdata, error: serr } = await scratchClient().auth.signUp({ email, password });
  if(serr){ msg.textContent = serr.message; return; }
  if(!sdata.user){ msg.textContent = 'Signup failed — please try again.'; return; }

  // 3. Sign in as the new vendor so the claim runs under their identity
  const { error: sierr } = await sb.auth.signInWithPassword({ email, password });
  if(sierr){ msg.textContent = 'Account created. Please confirm your email if required, then sign in.'; return; }

  // 4. Claim the pre-created vendor row (or create a fresh one) via SECURITY DEFINER function
  const { error: claimErr } = await sb.rpc('claim_vendor_row', {
    p_company_id: company.id, p_email: email, p_auth_user_id: sdata.user.id, p_name: name
  });
  if(claimErr){ msg.textContent = 'Linked account failed: '+claimErr.message; return; }

  msg.style.color = 'var(--green)';
  msg.textContent = 'Account created and linked to '+company.name+'. Loading…';
  state.session = (await sb.auth.getSession()).data.session;
  await resolveRole();
}

  const name = document.getElementById('co-name').value.trim();
  const adminName = document.getElementById('co-admin-name').value.trim();
  const email = document.getElementById('co-email').value.trim();
  const password = document.getElementById('co-pass').value;
  const msg = document.getElementById('co-msg');
  msg.style.color = 'var(--red)';
  if(!name || !adminName || !email || !password){ msg.textContent = 'All fields are required.'; return; }
  if(password.length < 6){ msg.textContent = 'Password must be at least 6 characters.'; return; }
  msg.style.color = 'var(--ink-soft)';
  msg.textContent = 'Setting up your workspace…';

  // 1. Create the auth account (scratch client so no session clash)
  const { data: sdata, error: serr } = await scratchClient().auth.signUp({ email, password });
  if(serr){ msg.style.color='var(--red)'; msg.textContent = serr.message; return; }
  if(!sdata.user){ msg.style.color='var(--red)'; msg.textContent = 'Signup failed — please try again.'; return; }

  // 2. Sign in as the new user so the company-creation runs under their identity
  const { error: sierr } = await sb.auth.signInWithPassword({ email, password });
  if(sierr){ msg.style.color='var(--red)'; msg.textContent = 'Account created. If email confirmation is on, confirm it then sign in.'; return; }

  // 3. Create the company + admin + trial via SECURITY DEFINER function
  const { error: cErr } = await sb.rpc('signup_company', {
    p_company_name: name, p_admin_name: adminName, p_admin_email: email, p_auth_user_id: sdata.user.id
  });
  if(cErr){ msg.style.color='var(--red)'; msg.textContent = 'Could not create company: '+cErr.message; return; }

  msg.style.color = 'var(--green)';
  msg.textContent = 'Welcome to Kiyra! Loading your 14-day trial…';
  state.session = (await sb.auth.getSession()).data.session;
  await resolveRole();
}
function shell(title, roleLabel, bodyHtml, tabs, renderFn){
  tabs = tabs || [];
  const nav = tabs.map(([k,l])=>`<div class="navlink ${state.activeTab===k?'active':''}" onclick="closeSidebar();${renderFn}('${k}')">${l}</div>`).join('');
  return `
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <h1>Kiy<span class="mark">ra</span>${title?(' <span style="color:#7d8894;font-weight:400;">/ '+title+'</span>'):''}</h1>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="who">${roleLabel}</span>
      <button class="btn btn-sm" onclick="openChangePassword()">Change password</button>
      <button class="btn btn-sm" onclick="signOut()">Sign out</button>
    </div>
  </header>
  <div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
    <nav class="sidebar" id="sidebar">${nav}</nav>
    <div class="main-content">${bodyHtml}</div>
  </div>`;
}
function toggleSidebar(){
  document.getElementById('sidebar')?.classList.toggle('open');
  document.getElementById('sidebarBackdrop')?.classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebarBackdrop')?.classList.remove('open');
}

async function createCompany(){
  const name = document.getElementById('nc-name').value.trim();
  const slug = document.getElementById('nc-slug').value.trim();
  const gstin = document.getElementById('nc-gstin').value.trim();
  const contact_email = document.getElementById('nc-email').value.trim();
  const approval_levels = parseInt(document.getElementById('nc-levels').value) || 1;
  const adminEmail = document.getElementById('nc-admin-email').value.trim();
  const adminPass = document.getElementById('nc-admin-pass').value;
  const msg = document.getElementById('nc-msg');
  const btn = document.getElementById('nc-submit-btn');

  msg.style.color = 'var(--red)';
  msg.textContent = '';

  if(!name || !slug){ msg.textContent = 'Company name and slug are required.'; return; }
  if(adminEmail && adminPass && adminPass.length < 6){ msg.textContent = 'Admin password must be at least 6 characters (Supabase minimum).'; return; }
  if(adminPass && !adminEmail){ msg.textContent = 'Admin email is required if you set a password.'; return; }

  btn.disabled = true;
  btn.textContent = 'Creating…';

  try{
    const { data: company, error } = await sb.from('companies').insert({name, slug, gstin, contact_email, approval_levels}).select().single();
    if(error){
      msg.textContent = error.code === '23505' ? `That slug is already taken — pick a different one.` : error.message;
      return;
    }

    if(adminEmail && adminPass){
      // Use an isolated client so this signUp doesn't disturb our current (superadmin) session.
      const { data: sdata, error: serr } = await scratchClient().auth.signUp({ email: adminEmail, password: adminPass });
      if(serr){ msg.textContent = 'Company created, but admin account failed: '+serr.message+' — you can add the admin later from the company detail view.'; return; }
      const { error: cuErr } = await sb.from('company_users').insert({
        company_id: company.id, auth_user_id: sdata.user.id, email: adminEmail, role:'company_admin', name: adminEmail
      });
      if(cuErr){ msg.textContent = 'Company created, but linking the admin failed: '+cuErr.message; return; }
    }
    await logActivity(company.id, 'created_company', 'company', company.id, {name});
    closeModal();
    toast('Company created');
    renderSuperadmin('companies');
  } catch(e){
    msg.textContent = 'Unexpected error: ' + (e.message || e);
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = 'Create company'; }
  }
}

async function renderCompanyApp(tab){
  state.activeTab = tab || state.activeTab || 'dashboard';

  try { history.replaceState(null, '', '#' + state.activeTab); sessionStorage.setItem('kiyra_tab', state.activeTab); } catch(e){}
  const cid = state.company.id;

    if(st){ state.company.plan_status = st; }
  } catch(e){}
  state.readOnly = state.company.plan_status === 'expired';

  let tabs = [['dashboard','Dashboard'],['pos','Purchase Orders'],['invoices','Invoices / Approvals'],['payables','Payables'],['payments','Payments'],['reports','Reports'],['vendors','Vendors']];
  if(isAdmin) tabs.push(['users','Team']);
  if(isAdmin) tabs.push(['auditlog','Audit Log']);
  if(isAdmin) tabs.push(['settings','Settings']);
  // Non-admins with a restricted tab set only see their allowed tabs.
  // allowed_tabs is null/undefined for full access; an array restricts.
  const allowed = state.profile.allowed_tabs;
  if(!isAdmin && Array.isArray(allowed) && allowed.length){
    tabs = tabs.filter(([k])=>allowed.includes(k));
    // Safety: if their current tab isn't allowed, snap to the first allowed one.
    if(!allowed.includes(state.activeTab) && tabs.length){ state.activeTab = tabs[0][0]; }
  }
  state.__companyTabs = tabs;

  // Guard: block rendering a tab the user isn't allowed to see (defense in depth).
  if(!isAdmin && Array.isArray(allowed) && allowed.length && !allowed.includes(state.activeTab)){
    state.activeTab = tabs.length ? tabs[0][0] : 'dashboard';
  }

  let body = '';

  // Trial / expiry banner
  if(state.company.plan_status === 'expired'){
    body += `<div style="background:var(--red-soft);border:1px solid #f3b6b0;border-radius:12px;padding:14px 18px;margin-bottom:16px;">
      <strong style="color:var(--red);">Your free trial has ended.</strong>
      <span style="color:var(--ink-soft);font-size:13.5px;"> Your account is now read-only — you can view and export data, but can't create or edit. To reactivate, choose a plan: contact us on WhatsApp <a href="https://wa.me/918882335548">+91 88823 35548</a> or email anshulggrg@gmail.com.</span>
    </div>`;
  } else if(state.company.plan === 'trial' && state.company.trial_ends_at){
    const daysLeft = Math.ceil((new Date(state.company.trial_ends_at) - new Date())/(1000*60*60*24));
    if(daysLeft >= 0){
      body += `<div style="background:var(--primary-soft);border:1px solid #bcd4f2;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;color:var(--ink);">
        <strong>Free trial:</strong> ${daysLeft} day${daysLeft===1?'':'s'} left. Enjoying Kiyra? <a href="https://wa.me/918882335548">Talk to us</a> to pick a plan.
      </div>`;
    }
  }

  if(state.activeTab === 'dashboard'){
    const { data: pos } = await sb.from('purchase_orders').select('id,status,total_amount,created_at,vendor_id,vendors(name)').eq('company_id',cid);
    const { data: invs } = await sb.from('invoices').select('id,status,total_amount,submitted_at,vendor_id,gstr2b_status,gst_amount,amount_paid,manual_hold_amount').eq('company_id',cid);
    const { data: vendors } = await sb.from('vendors').select('id,name,status').eq('company_id',cid);
    const p = state.plan || {};
    const uCount = await countRows('company_users');

    const poList = pos||[], invList = invs||[], vList = vendors||[];
    const pending = invList.filter(i=>['submitted','under_review'].includes(i.status));
    const approvedInv = invList.filter(i=>i.status==='approved' || i.status==='paid');
    const paidInv = invList.filter(i=>i.status==='paid');
    const approvedValue = approvedInv.reduce((s,i)=>s+Number(i.total_amount),0);
    const paidValue = paidInv.reduce((s,i)=>s+Number(i.total_amount),0);
    const itcHoldTotal = invList.reduce((s,i)=>s+totalHold(i),0);
    const poValue = poList.reduce((s,i)=>s+Number(i.total_amount),0);
    const activeVendors = vList.filter(v=>v.status==='active').length;
    const pendingVendors = vList.filter(v=>v.status==='pending').length;

    // ---- monthly PO trend (last 6 months) ----
    const months = [];
    const now = new Date();
    for(let k=5;k>=0;k--){
      const d = new Date(now.getFullYear(), now.getMonth()-k, 1);
      months.push({ key:`${d.getFullYear()}-${d.getMonth()}`, label:d.toLocaleDateString('en-IN',{month:'short'}), value:0, count:0 });
    }
    poList.forEach(po=>{
      const d = new Date(po.created_at);
      const key = `${d.getFullYear()}-${d.getMonth()}`;
      const m = months.find(x=>x.key===key);
      if(m){ m.value += Number(po.total_amount); m.count++; }
    });
    const maxMonth = Math.max(1, ...months.map(m=>m.value));
    const barChart = `<div class="barchart">${months.map(m=>`
      <div class="bar-col">
        <div class="bar-val">${m.value>0?('₹'+Math.round(m.value/1000)+'k'):''}</div>

        <div class="bar-label">${m.label}</div>
      </div>`).join('')}</div>`;

    // ---- top vendors by PO value ----
    const vendorSpend = {};
    poList.forEach(po=>{
      const name = po.vendors?.name || 'Unknown';
      vendorSpend[name] = (vendorSpend[name]||0) + Number(po.total_amount);
    });
    const topVendors = Object.entries(vendorSpend).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const maxVendor = Math.max(1, ...topVendors.map(v=>v[1]));

    const totalInv = invList.length || 1;

    const segments = Object.entries(statusCounts).map(([st,ct])=>{
      const start = acc/totalInv*360; acc += ct; const end = acc/totalInv*360;
      return `${statusColors[st]||'#ccc'} ${start}deg ${end}deg`;
    }).join(', ');
    const donut = invList.length ? `
      <div style="display:flex;gap:20px;align-items:center;">

    (invForMatch||[]).forEach(i=>{

    });

      <div class="card">

    <div class="grid grid-2">
      <div class="card">

async function saveCompanySettings(){
  const msg = document.getElementById('set-msg');
  const po_number_prefix = document.getElementById('set-prefix').value.trim() || 'PO';
  const currency = document.getElementById('set-currency').value.trim() || 'INR';
  const annual_budget = document.getElementById('set-budget').value ? parseFloat(document.getElementById('set-budget').value) : null;
  const po_requires_approval = document.getElementById('set-po-approval').value === 'true';
  const gstin = document.getElementById('set-gstin').value.trim().toUpperCase();
  if(gstin && !/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z][Z][0-9A-Z]$/.test(gstin)){
    msg.textContent = 'That GSTIN doesn\'t match the standard 15-character format (e.g. 27ABCDE1234F1Z5).';
    return;
  }
  const { error } = await sb.from('companies').update({po_number_prefix, currency, annual_budget, po_requires_approval, gstin}).eq('id', state.company.id);
  if(error){ msg.textContent = error.message; return; }
  state.company = {...state.company, po_number_prefix, currency, annual_budget, po_requires_approval, gstin};
  toast('Settings saved');
}

async function openPOApprovalModal(id){
  const { data: po } = await sb.from('purchase_orders').select('*, vendors(name)').eq('id',id).single();
  const { data: history } = await sb.from('po_approvals').select('*, company_users(name,email)').eq('po_id', id).order('acted_at');
  const levels = state.company.approval_levels || 1;
  const canApprove = state.role === 'company_admin' || (state.role==='approver' && state.profile.approval_level === po.current_approval_level);
  showModal(`
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>PO ${po.po_number}</h3>
    <p class="muted">Vendor: ${po.vendors?.name}</p>
    <p>Amount: <strong>${fmtMoney(po.total_amount)}</strong> · Approval level ${po.current_approval_level} of ${levels}</p>
    <div style="margin-top:10px;">${(history||[]).length ? history.map(h=>`<p class="muted">${badge(h.action)} by ${h.company_users?.name||h.company_users?.email} on ${fmtDate(h.acted_at)} ${h.comments?('— '+h.comments):''}</p>`).join('') : '<p class="muted">No actions yet.</p>'}</div>
    ${canApprove ? `
      <label style="margin-top:10px;display:block;">Comments</label>
      <textarea id="po-appr-comments" rows="2"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-green" style="flex:1;" onclick="actOnPO('${id}','approved')">Approve</button>
        <button class="btn btn-danger" style="flex:1;" onclick="actOnPO('${id}','rejected')">Reject</button>
      </div>
    ` : '<p class="muted">Waiting on a different approval level.</p>'}
  `);
}
async function actOnPO(id, action){
  const comments = document.getElementById('po-appr-comments').value;
  const { data: po } = await sb.from('purchase_orders').select('*').eq('id', id).single();
  const levels = state.company.approval_levels || 1;
  await sb.from('po_approvals').insert({ po_id: id, approver_id: state.profile.id, level: po.current_approval_level, action, comments });
  if(action === 'rejected'){
    await sb.from('purchase_orders').update({status:'rejected'}).eq('id', id);
  } else {
    if(po.current_approval_level >= levels){
      await sb.from('purchase_orders').update({status:'approved'}).eq('id', id);
    } else {
      await sb.from('purchase_orders').update({status:'pending_approval', current_approval_level: po.current_approval_level+1}).eq('id', id);
    }
  }
  await logActivity(state.company.id, `po_${action}`, 'purchase_order', id, {comments});
  closeModal(); toast('Recorded'); renderCompanyApp('pos');
}

async function markInvoicePaid(id){
  if(blockedReadOnly()) return;
  const { data: i, error } = await sb.from('invoices').select('*, vendors(name)').eq('id', id).single();
  if(error){ toast(error.message, true); return; }
  const gst = Number(i.gst_amount||0);
  const total = Number(i.total_amount);
  const taxable = Number(i.taxable_value|| (total - gst));
  const st2b = i.gstr2b_status || 'pending';
  const alreadyPaid = Number(i.amount_paid||0);
  const reflected = st2b === 'reflected';
  // suggested "pay now" = full if reflected, else taxable value only
  const suggested = reflected ? total : taxable;
  showModal(`
    <span class="close-x" onclick="closeModal()">✕</span>
    <h3>Record payment</h3>
    <p class="muted">Invoice ${i.invoice_number} · ${i.vendors?.name||''}</p>
    <table style="font-size:13px;margin:10px 0;">
      <tr><td>Invoice total</td><td style="text-align:right;">${fmtMoney(total)}</td></tr>
      <tr><td>Taxable value</td><td style="text-align:right;">${fmtMoney(taxable)}</td></tr>
      <tr><td>GST amount</td><td style="text-align:right;">${fmtMoney(gst)}</td></tr>
      <tr><td>GSTR-2B</td><td style="text-align:right;">${gstr2bBadge(st2b)}</td></tr>
      ${alreadyPaid>0?`<tr><td>Already paid</td><td style="text-align:right;">${fmtMoney(alreadyPaid)}</td></tr>`:''}
    </table>
    ${!reflected && gst>0 ? `<div style="background:#f7efe0;border:1px solid #e8d5b0;border-radius:8px;padding:10px;font-size:13px;color:#8a6420;margin-bottom:10px;">
      This invoice isn't reflected in GSTR-2B yet. You can pay the taxable value now and <strong>hold ${fmtMoney(gst)} of GST</strong> until it reflects, protecting your input tax credit.
    </div>`:''}
    <label style="display:block;">Amount to pay now (₹)</label>
    <input id="pay-amount" type="number" step="0.01" value="${(suggested - alreadyPaid).toFixed(2)}"/>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button class="btn btn-sm" onclick="document.getElementById('pay-amount').value='${(taxable-alreadyPaid).toFixed(2)}'">Taxable only</button>
      <button class="btn btn-sm" onclick="document.getElementById('pay-amount').value='${(total-alreadyPaid).toFixed(2)}'">Full amount</button>
    </div>
    <label style="display:block;margin-top:10px;">Payment date</label>
    <input id="pay-date" type="date" value="${new Date().toISOString().slice(0,10)}"/>
    <label style="display:block;margin-top:10px;">Payment reference (UTR / cheque no.) — optional</label>
    <input id="pay-ref" type="text"/>
    <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="confirmPayment('${id}')">Record payment</button>
  `);
}
async function confirmPayment(id){
  const payNow = parseFloat(document.getElementById('pay-amount').value)||0;
  const ref = document.getElementById('pay-ref').value.trim() || null;
  const dateEl = document.getElementById('pay-date');
  const paidOn = dateEl && dateEl.value ? dateEl.value : new Date().toISOString().slice(0,10);
  if(payNow <= 0){ toast('Enter an amount greater than zero', true); return; }
  const { data: i } = await sb.from('invoices').select('total_amount, amount_paid, vendor_id').eq('id', id).single();
  const total = Number(i.total_amount);
  const newPaid = Number(i.amount_paid||0) + payNow;
  const fullyPaid = newPaid >= total - 0.01;
  // 1. record the dated payment in the payments log
  const { error: payErr } = await sb.from('payments').insert({
    company_id: state.company.id, invoice_id: id, vendor_id: i.vendor_id,
    amount: payNow, paid_on: paidOn, reference: ref
  });
  if(payErr){ toast('Could not record payment: '+payErr.message, true); return; }
  // 2. update the invoice running total + status
  const patch = {
    amount_paid: newPaid,
    payment_reference: ref,
    status: fullyPaid ? 'paid' : 'approved',
    paid_at: fullyPaid ? new Date().toISOString() : null
  };
  const { error } = await sb.from('invoices').update(patch).eq('id', id);
  if(error){ toast(error.message, true); return; }
  await logActivity(state.company.id, fullyPaid?'invoice_paid':'invoice_part_paid', 'invoice', id, {payNow, ref, paidOn});
  closeModal();
  toast(fullyPaid ? 'Invoice fully paid' : `Part payment recorded · balance ${fmtMoney(total-newPaid)}`);
  renderCompanyApp('invoices');
}

// Three options as requested: Not yet checked / Matched (in 2B) / Unmatched (not in 2B)
function openGst2bQuickMenu(ev, id, current){
  ev.stopPropagation();
  document.querySelectorAll('.row-menu').forEach(m=>m.remove());
  // Read the CURRENT status live from the row's data attribute, so the ✓ always
  // reflects the latest value even if something changed since render.
  const rowEl = ev.currentTarget.closest('tr');
  const liveCurrent = (rowEl && rowEl.getAttribute('data-gst2b')) || current || 'pending';
  const menu = document.createElement('div');
  menu.className = 'row-menu';
  const opt = (val, label, cls)=>`<button onclick='setGst2bQuick(${JSON.stringify(id)},"${val}")'>
      <span class="badge ${cls}" style="pointer-events:none;">${label}</span>${liveCurrent===val?' <strong style="color:var(--primary);">✓</strong>':''}
    </button>`;
  menu.innerHTML =
    opt('pending','Not yet checked','badge-pending2b') +
    opt('reflected','Matched (in 2B)','badge-reflected') +
    opt('not_reflected','Unmatched (not in 2B)','badge-not_reflected');
  document.body.appendChild(menu);
  const r = ev.currentTarget.getBoundingClientRect();
  menu.style.top = (r.bottom+4)+'px';
  menu.style.left = Math.min(r.left, window.innerWidth-200)+'px';
  setTimeout(()=>document.addEventListener('click', closeRowMenu, {once:true}), 0);
}

// GSTR-2B AUTO-RECONCILIATION (Level 2)
// Upload the GSTR-2B (JSON or Excel) downloaded from the GST portal,
// auto-match against purchase invoices by GSTIN + invoice number,
// check tax amounts (with near-match tolerance), then let the user
// apply the results in bulk.
// ============================================================

// Normalise an invoice number so trivial formatting differences still match:
// uppercase, strip spaces/slashes/hyphens, drop leading zeros on trailing digits.
function normInvNo(s){
  if(s===null||s===undefined) return '';
  let x = String(s).toUpperCase().replace(/[\s\/\-_.]/g,'');
  // strip leading zeros from any trailing number block (INV001 -> INV1)
  x = x.replace(/([A-Z]*)0*([0-9]+)$/, (m,a,b)=>a+String(parseInt(b,10)));
  return x;
}
function normGstin(s){ return (s||'').toString().toUpperCase().replace(/\s/g,''); }

// Parse a GSTR-2B JSON structure into a flat list of {gstin, invNo, taxable, tax}
function parse2bJson(obj){
  const out = [];
  // The GSTR-2B JSON nests supplier docs under data.docdata.b2b[].inv[]
  // but portals/versions vary; walk defensively.
  const root = obj.data || obj;
  const b2bBlocks = (root.docdata && root.docdata.b2b) || root.b2b || [];
  (b2bBlocks||[]).forEach(supplier=>{
    const gstin = supplier.ctin || supplier.gstin || '';
    (supplier.inv||supplier.invoices||[]).forEach(inv=>{
      // tax may be at inv level or inside items[].itm_det
      let igst=0,cgst=0,sgst=0,txval=0;
      if(Array.isArray(inv.items)){
        inv.items.forEach(it=>{ const d=it.itm_det||it; igst+=+d.iamt||0; cgst+=+d.camt||0; sgst+=+d.samt||0; txval+=+d.txval||0; });
      } else {
        igst=+inv.igst||+inv.iamt||0; cgst=+inv.cgst||+inv.camt||0; sgst=+inv.sgst||+inv.samt||0; txval=+inv.txval||0;
      }
      out.push({ gstin, invNo: inv.inum||inv.invoice_number||'', taxable: txval, tax: igst+cgst+sgst });
    });
  });
  return out;
}

// Parse a GSTR-2B Excel workbook (SheetJS already loaded) into the same flat list.
function parse2bExcel(wb){
  const out = [];
  wb.SheetNames.forEach(name=>{
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:''});
    // find a header row containing GSTIN and Invoice number columns
    let hIdx = -1, col = {};
    for(let r=0;r<Math.min(rows.length,15);r++){
      const cells = rows[r].map(c=>String(c).toLowerCase());
      const gi = cells.findIndex(c=>c.includes('gstin'));
      const ii = cells.findIndex(c=>c.includes('invoice number')||c==='invoice no.'||c.includes('invoice no'));
      if(gi>=0 && ii>=0){
        hIdx=r;
        col.gstin=gi; col.inv=ii;
        col.igst=cells.findIndex(c=>c.includes('integrated')||c==='igst');
        col.cgst=cells.findIndex(c=>c.includes('central')||c==='cgst');
        col.sgst=cells.findIndex(c=>c.includes('state/ut')||c.includes('state')||c==='sgst');
        col.txval=cells.findIndex(c=>c.includes('taxable'));
        break;
      }
    }
    if(hIdx<0) return; // not a data sheet
    for(let r=hIdx+1;r<rows.length;r++){
      const row = rows[r]; if(!row || !row[col.gstin]) continue;
      const num=(x)=>{ const n=parseFloat(String(x).replace(/,/g,'')); return isNaN(n)?0:n; };
      const igst=col.igst>=0?num(row[col.igst]):0, cgst=col.cgst>=0?num(row[col.cgst]):0, sgst=col.sgst>=0?num(row[col.sgst]):0;
      out.push({ gstin:String(row[col.gstin]), invNo:String(row[col.inv]), taxable: col.txval>=0?num(row[col.txval]):0, tax: igst+cgst+sgst });
    }
  });
  return out;
}

async function runReconcile2b(){
  const msg = document.getElementById('r2b-msg');
  msg.style.color = 'var(--ink-soft)';
  const file = document.getElementById('r2b-file').files[0];
  if(!file){ msg.style.color='var(--red)'; msg.textContent='Please choose a file first.'; return; }
  msg.textContent = 'Reading file…';
  let entries = [];
  try {
    if(/\.json$/i.test(file.name)){
      const text = await file.text();
      entries = parse2bJson(JSON.parse(text));
    } else {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      entries = parse2bExcel(wb);
    }
  } catch(e){
    msg.style.color='var(--red)'; msg.textContent = 'Could not read that file: '+e.message+'. Make sure it is the GSTR-2B JSON or Excel from the portal.'; return;
  }
  if(!entries.length){ msg.style.color='var(--red)'; msg.textContent='No invoice rows found in that file. Is it the full GSTR-2B (not the summary)?'; return; }

  // Build a lookup of 2B entries by gstin+normalised invoice number
  const map2b = {};
  entries.forEach(e=>{ map2b[normGstin(e.gstin)+'|'+normInvNo(e.invNo)] = e; });

  // Load our invoices with vendor GSTIN
  const { data: invs } = await sb.from('invoices').select('*, vendors(name,gstin)').eq('company_id', state.company.id);
  const results = [];
  const matchedKeys = new Set();
  (invs||[]).forEach(i=>{
    const gstin = normGstin(i.vendors?.gstin);
    const key = gstin+'|'+normInvNo(i.invoice_number);
    const ourTax = Number(i.gst_amount||0);
    const found = map2b[key];
    if(found){
      matchedKeys.add(key);
      const diff = Math.abs(Number(found.tax) - ourTax);
      if(diff <= 1){ results.push({inv:i, status:'exact', found, diff}); }
      else { results.push({inv:i, status:'nearmatch', found, diff}); }
    } else {
      results.push({inv:i, status:'notfound', found:null, diff:null});
    }
  });
  // 2B entries with no matching invoice in our books
  const orphans = entries.filter(e=> !matchedKeys.has(normGstin(e.gstin)+'|'+normInvNo(e.invNo)));

  window.__recon2b = { results, orphans };
  renderReconcile2bResults();
}

      <div class="kpi red"><div class="kpi-accent"></div><div class="kpi-label">Not in 2B</div><div class="kpi-value">${missing.length}</div></div>
      <div class="kpi"><div class="kpi-accent"></div><div class="kpi-label">In 2B, not in books</div><div class="kpi-value">${orphans.length}</div></div>
    </div>
    <p class="muted" style="font-size:12.5px;">Applying will set each invoice's 2B status: matched → <strong>In 2B</strong> (ITC released), not found → <strong>Not reflected</strong> (GST held). Amount-differs invoices are marked <strong>Not reflected</strong> so you can review them — nothing is auto-approved on a mismatch.</p>
    <div style="max-height:280px;overflow:auto;margin-top:8px;border:1px solid var(--border);border-radius:8px;">
      <table style="font-size:12.5px;">
        <tr><th>Invoice #</th><th>Vendor</th><th style="text-align:right;">Our GST</th><th style="text-align:right;">2B GST</th><th>Result</th></tr>
        ${rowsHtml(exact,'exact')}
        ${rowsHtml(near,'near')}
        ${rowsHtml(missing,'notfound')}
      </table>
    </div>
    ${orphans.length?`<details style="margin-top:10px;"><summary style="cursor:pointer;font-size:13px;font-weight:600;">${orphans.length} invoice(s) in 2B but not in your records</summary>
      <div style="max-height:160px;overflow:auto;margin-top:6px;"><table style="font-size:12px;"><tr><th>Supplier GSTIN</th><th>Invoice #</th><th style="text-align:right;">Tax</th></tr>
      ${orphans.map(o=>`<tr><td>${o.gstin}</td><td>${o.invNo}</td><td style="text-align:right;">${fmtMoney(o.tax)}</td></tr>`).join('')}</table></div>
      <p class="muted" style="font-size:12px;">These appear in your GSTR-2B but you have no matching purchase invoice — you may be missing an entry, or the invoice number differs. Worth checking.</p>
    </details>`:''}
    <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="applyReconcile2b()">Apply results to invoices</button>
  `, true);
}

async function applyReconcile2b(){
  if(blockedReadOnly()) return;
  const { results } = window.__recon2b;
  let applied = 0;
  for(const r of results){
    let status;
    if(r.status==='exact') status='reflected';
    else if(r.status==='nearmatch') status='not_reflected';  // needs review, keep held
    else { if(Number(r.inv.gst_amount)<=0) continue; status='not_reflected'; }
    await sb.from('invoices').update({ gstr2b_status: status, gstr2b_checked_at: new Date().toISOString() }).eq('id', r.inv.id).then(()=>{applied++;},()=>{});
  }
  await logActivity(state.company.id, 'gstr2b_reconciled', 'company', state.company.id, {applied});
  closeModal(); toast(`Applied 2B status to ${applied} invoice(s)`); renderCompanyApp('invoices');
}

// ============================================================
// UNIVERSAL EXPORT HELPERS — CSV, Excel (xlsx), PDF
// Each takes: filename, an array of header strings, and an array
// of row arrays (values in the same order as headers).
// ============================================================
function exportRowsCSV(filename, headers, rows){
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines = [headers.map(esc).join(',')].concat(rows.map(r=>r.map(esc).join(',')));
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename+'.csv'; a.click();
  URL.revokeObjectURL(url);
}
function exportRowsXLSX(filename, headers, rows, sheetName){
  if(typeof XLSX === 'undefined'){ toast('Excel library still loading — try again in a moment', true); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (sheetName||'Sheet1').slice(0,31));
  XLSX.writeFile(wb, filename+'.xlsx');
}
function exportRowsPDF(title, headers, rows){
  // Uses a print window styled as a simple report -> browser "Save as PDF".
  const w = window.open('', '_blank');
  const th = headers.map(h=>`<th style="text-align:left;border-bottom:2px solid #16202e;padding:6px 8px;font-size:11px;text-transform:uppercase;">${h}</th>`).join('');
  const trs = rows.map(r=>`<tr>${r.map(c=>`<td style="border-bottom:1px solid #ddd;padding:6px 8px;font-size:12px;">${c==null?'':c}</td>`).join('')}</tr>`).join('');
  w.document.write(`<html><head><title>${title}</title></head><body style="font-family:Arial,sans-serif;padding:24px;">
    <h2 style="color:#0f6f5c;margin:0 0 4px;">Kiyra</h2>
    <div style="font-size:16px;font-weight:bold;margin-bottom:2px;">${title}</div>
    <div style="font-size:12px;color:#666;margin-bottom:14px;">${state.company.name} · Generated ${new Date().toLocaleDateString('en-IN')}</div>
    <table style="width:100%;border-collapse:collapse;"><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>
    <script>window.onload=function(){window.print();}<\/script>
  </body></html>`);
  w.document.close();
}

// REPORTS ENGINE
// ============================================================
function onReportChange(){
  state.reportType = document.getElementById('rep-type').value;
  runReport();
}
function inRange(dateStr, from, to){
  if(!dateStr) return true;
  const d = new Date(dateStr);
  if(from && d < new Date(from)) return false;
  if(to){ const t = new Date(to); t.setHours(23,59,59); if(d > t) return false; }
  return true;
}
function reportTitle(type){
  return ({
    payables:'Vendor-wise payables / pendency', itc:'GST / ITC hold register',
    purchase:'Purchase register', paymentreg:'Payment register',
    aging:'Aging report', gstcompliance:'Vendor GST compliance'
  })[type] || 'Report';
}
async function runReport(){
  const type = (document.getElementById('rep-type')||{}).value || state.reportType || 'payables';
  state.reportType = type;
  state.reportFrom = (document.getElementById('rep-from')||{}).value || '';
  state.reportTo = (document.getElementById('rep-to')||{}).value || '';
  const out = document.getElementById('report-output');
  if(out) out.innerHTML = '<div class="card"><p class="muted">Running report…</p></div>';
  // toggle the delete button visibility for custom reports
  const delBtn = document.getElementById('rep-delete-btn');
  if(delBtn) delBtn.style.display = type.startsWith('custom:') ? 'inline-block' : 'none';
  // custom report dispatch
  if(type.startsWith('custom:')){ await runCustomReport(type.split(':')[1]); return; }
  const cid = state.company.id;
  let headers = [], rows = [], summary = '', moneyCols = [];
  const from = state.reportFrom, to = state.reportTo;

  if(type==='payables'){
    const { data: invs } = await sb.from('invoices').select('*, vendors(name)').eq('company_id',cid);
    const byV = {};
    (invs||[]).filter(i=>inRange(i.submitted_at, from, to)).forEach(i=>{
      const k = i.vendor_id||'?'; const name = i.vendors?.name||'Unknown';
      if(!byV[k]) byV[k]={name,billed:0,paid:0,held:0,due:0};
      const total=Number(i.total_amount||0), paid=amountPaidEff(i), held=i.status==='paid'?0:totalHold(i);
      byV[k].billed+=total; byV[k].paid+=paid; byV[k].held+=held; byV[k].due+=amountDue(i);
    });
    headers=['Vendor','Billed','Paid','Held','Due'];
    rows=Object.values(byV).sort((a,b)=>b.due-a.due).map(v=>[v.name,v.billed.toFixed(2),v.paid.toFixed(2),v.held.toFixed(2),v.due.toFixed(2)]);
    summary=`Total due: ${fmtMoney(Object.values(byV).reduce((s,v)=>s+v.due,0))}`;
    moneyCols = [1,2,3,4];
  }
  else if(type==='itc'){
    const { data: invs } = await sb.from('invoices').select('*, vendors(name)').eq('company_id',cid);
    const list = (invs||[]).filter(i=>inRange(i.submitted_at, from, to)).filter(i=>itcOnHold(i)>0 || (i.gstr2b_status && i.gstr2b_status!=='reflected' && Number(i.gst_amount)>0));
    headers=['Invoice #','Vendor','Total','GST','2B status','ITC held'];
    rows=list.map(i=>[i.invoice_number, i.vendors?.name||'', Number(i.total_amount).toFixed(2), Number(i.gst_amount||0).toFixed(2), (i.gstr2b_status||'pending'), itcOnHold(i).toFixed(2)]);
    summary=`ITC at risk: ${fmtMoney(list.reduce((s,i)=>s+itcOnHold(i),0))} across ${list.length} invoice(s)`;
    moneyCols=[2,3,5];
  }
  else if(type==='purchase'){
    const { data: pos } = await sb.from('purchase_orders').select('*, vendors(name)').eq('company_id',cid);
    const list = (pos||[]).filter(p=>inRange(p.created_at, from, to));
    headers=['PO #','Vendor','Amount','Status','Created'];
    rows=list.map(p=>[p.po_number, p.vendors?.name||'', Number(p.total_amount).toFixed(2), p.status, fmtDate(p.created_at)]);
    summary=`${list.length} PO(s) · Total ${fmtMoney(list.reduce((s,p)=>s+Number(p.total_amount),0))}`;
    moneyCols=[2];
  }
  else if(type==='paymentreg'){
    const { data: pays } = await sb.from('payments').select('*, invoices(invoice_number), vendors(name)').eq('company_id',cid);
    const list = (pays||[]).filter(p=>inRange(p.paid_on, from, to)).sort((a,b)=>new Date(b.paid_on)-new Date(a.paid_on));
    headers=['Date','Vendor','Invoice #','Amount','Reference'];
    rows=list.map(p=>[fmtDate(p.paid_on), p.vendors?.name||'', p.invoices?.invoice_number||'', Number(p.amount).toFixed(2), p.reference||'']);
    summary=`${list.length} payment(s) · Total ${fmtMoney(list.reduce((s,p)=>s+Number(p.amount),0))}`;
    moneyCols=[3];
  }
  else if(type==='aging'){
    const { data: invs } = await sb.from('invoices').select('*, vendors(name)').eq('company_id',cid);
    const now = new Date();
    const buckets = {};
    (invs||[]).filter(i=>inRange(i.submitted_at, from, to)).forEach(i=>{
      const total=Number(i.total_amount||0), paid=amountPaidEff(i), held=i.status==='paid'?0:totalHold(i);
      const due=amountDue(i);
      if(due<=0.01) return;
      const days = Math.floor((now - new Date(i.submitted_at))/(1000*60*60*24));
      const b = days<=30?'0-30':days<=60?'31-60':days<=90?'61-90':'90+';
      const k = i.vendor_id||'?'; const name=i.vendors?.name||'Unknown';
      if(!buckets[k]) buckets[k]={name,'0-30':0,'31-60':0,'61-90':0,'90+':0,total:0};
      buckets[k][b]+=due; buckets[k].total+=due;
    });
    headers=['Vendor','0-30 days','31-60','61-90','90+','Total due'];
    rows=Object.values(buckets).sort((a,b)=>b.total-a.total).map(v=>[v.name,v['0-30'].toFixed(2),v['31-60'].toFixed(2),v['61-90'].toFixed(2),v['90+'].toFixed(2),v.total.toFixed(2)]);
    summary=`Total outstanding: ${fmtMoney(Object.values(buckets).reduce((s,v)=>s+v.total,0))}`;
    moneyCols=[1,2,3,4,5];
  }
  else if(type==='gstcompliance'){
    const { data: invs } = await sb.from('invoices').select('*, vendors(name)').eq('company_id',cid);
    const byV = {};
    (invs||[]).filter(i=>inRange(i.submitted_at, from, to)).forEach(i=>{
      const k=i.vendor_id||'?'; const name=i.vendors?.name||'Unknown';
      if(!byV[k]) byV[k]={name,total:0,reflected:0,notReflected:0,pending:0};
      byV[k].total++;
      const s=i.gstr2b_status||'pending';
      if(s==='reflected') byV[k].reflected++; else if(s==='not_reflected') byV[k].notReflected++; else byV[k].pending++;
    });
    headers=['Vendor','Invoices','In 2B','Not in 2B','Pending','Compliance %'];
    rows=Object.values(byV).sort((a,b)=>(a.reflected/a.total)-(b.reflected/b.total)).map(v=>[
      v.name, v.total, v.reflected, v.notReflected, v.pending,
      v.total? Math.round(100*v.reflected/v.total)+'%':'—'
    ]);
    summary=`${Object.keys(byV).length} vendor(s)`;
  }

  state.__reportData = { type, headers, rows, title: reportTitle(type), moneyCols };
  renderReportTable(headers, rows, summary, reportTitle(type), moneyCols);
}
function renderReportTable(headers, rows, summary, title, moneyCols){
  moneyCols = moneyCols || [];
  const out = document.getElementById('report-output');
  if(!out) return;
  const fmtCell = (c, idx) => moneyCols.includes(idx) ? fmtMoney(c) : c;
  out.innerHTML = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <div><h3 style="margin:0;">${title}</h3><p class="muted" style="margin:2px 0 0;">${summary||''}${(state.reportFrom||state.reportTo)?` · ${state.reportFrom||'start'} to ${state.reportTo||'today'}`:''}</p></div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-sm" onclick="exportReport('csv')">CSV</button>
        <button class="btn btn-sm" onclick="exportReport('xlsx')">Excel</button>
        <button class="btn btn-sm" onclick="exportReport('pdf')">PDF</button>
      </div>
    </div>
    ${buildFilterBar('rep-table', { search:true })}
    <table id="rep-table" style="margin-top:6px;">
      <tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>
      ${rows.map(r=>`<tr data-search="${r.join(' ').toLowerCase().replace(/"/g,'&quot;')}">${r.map((c,idx)=>`<td>${fmtCell(c,idx)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${headers.length}" class="muted">No data for this period.</td></tr>`}
    </table>
  </div>`;
}
function exportReport(fmt){
  const d = state.__reportData;
  if(!d) return;
  const fn = `${d.type}_${state.company.slug}`;
  // export keeps raw numeric values (no ₹) for clean CSV/Excel; PDF can show formatted
  if(fmt==='csv') exportRowsCSV(fn, d.headers, d.rows);
  else if(fmt==='xlsx') exportRowsXLSX(fn, d.headers, d.rows, d.title.slice(0,28));
  else {
    const disp = d.rows.map(r=>r.map((c,idx)=>(d.moneyCols||[]).includes(idx)?fmtMoney(c):c));
    exportRowsPDF(d.title, d.headers, disp);
  }
}

async function runCustomReport(id){
  const rep = (window.__customReports||[]).find(c=>c.id===id);
  if(!rep){ return; }
  const srcDef = REPORT_SOURCES[rep.source];
  if(!srcDef){ return; }
  const { data } = await srcDef.query(state.company.id);
  const from = state.reportFrom, to = state.reportTo;
  const f = rep.filters||{};
  let list = (data||[]).filter(r=>inRange(r[srcDef.dateField], from, to));
  // apply saved filters
  if(f.status) list = list.filter(r=> (r.status||'').toLowerCase().includes(f.status.toLowerCase()));
  if(f.vendor) list = list.filter(r=> (r.vendors?.name||'').toLowerCase().includes(f.vendor.toLowerCase()));
  const chosen = srcDef.columns.filter(c=>rep.columns.includes(c.key));
  const amtCol = chosen.find(c=>c.money);
  if((f.amtMin||f.amtMax) && amtCol){
    list = list.filter(r=>{ const v = amtCol.get(r); if(f.amtMin && v<parseFloat(f.amtMin)) return false; if(f.amtMax && v>parseFloat(f.amtMax)) return false; return true; });
  }
  const headers = chosen.map(c=>c.label);
  const moneyCols = chosen.map((c,i)=>c.money?i:-1).filter(i=>i>=0);
  const rows = list.map(r=>chosen.map(c=>{ const v=c.get(r); return c.money? Number(v).toFixed(2): v; }));
  state.__reportData = { type:'custom_'+id, headers, rows, title: rep.name, moneyCols };
  renderReportTable(headers, rows, `${rows.length} row(s)`, rep.name, moneyCols);
  const delBtn = document.getElementById('rep-delete-btn'); if(delBtn) delBtn.style.display='inline-block';
}
async function deleteCurrentCustomReport(){

}

// ---- PO creation ----
// ---- GST: CGST+SGST (intrastate) vs IGST (interstate) ----
// Determined by comparing the first 2 digits (state code) of the company's GSTIN
// and the selected vendor's GSTIN. If either is missing, we can't determine this
// and fall back to showing GST as a single combined figure.
function gstStateCode(gstin){
  return (gstin && gstin.length >= 2) ? gstin.slice(0,2) : null;
}
function currentPOTaxSplit(){
  const vendorSelect = document.getElementById('po-vendor');
  const opt = vendorSelect?.options[vendorSelect.selectedIndex];
  const vendorGstin = opt?.dataset?.gstin || '';
  const companyGstin = state.company.gstin || '';
  const cCode = gstStateCode(companyGstin);
  const vCode = gstStateCode(vendorGstin);
  if(!cCode || !vCode) return 'unknown';
  return cCode === vCode ? 'intrastate' : 'interstate';
}

// This is an indicative lookup only — many HSN codes have exceptions/notifications

function lookupGSTFromHSN(code){
  if(!code) return null;
  const c = code.trim().replace(/\s/g,'');
  // 1. Exact specific-code overrides (most accurate) — checked first
  if(HSN_GST_SPECIFIC[c] !== undefined) return HSN_GST_SPECIFIC[c];
  if(c.length>=6 && HSN_GST_SPECIFIC[c.slice(0,6)] !== undefined) return HSN_GST_SPECIFIC[c.slice(0,6)];
  // 2. Fall back to chapter/heading defaults (indicative)
  if(HSN_GST_TABLE[c] !== undefined) return HSN_GST_TABLE[c];
  if(c.length>=6 && HSN_GST_TABLE[c.slice(0,6)] !== undefined) return HSN_GST_TABLE[c.slice(0,6)];
  if(c.length>=4 && HSN_GST_TABLE[c.slice(0,4)] !== undefined) return HSN_GST_TABLE[c.slice(0,4)];
  if(c.length>=2 && HSN_GST_TABLE[c.slice(0,2)] !== undefined) return HSN_GST_TABLE[c.slice(0,2)];
  return null;
}
function onHSNInput(id){
  const hsn = document.getElementById(`po-item-hsn-${id}`)?.value;
  const rate = lookupGSTFromHSN(hsn);
  const gstField = document.getElementById(`po-item-gst-${id}`);
  // Only auto-fill if the user hasn't manually set/touched the GST field.
  // Once the user edits GST themselves, we never overwrite it.
  const touched = gstField?.dataset?.touched === '1';
  if(rate !== null && gstField && !touched){
    gstField.value = rate;
    gstField.dataset.autofilled = '1';
  }
  recalcPOTotal();
}
function onGSTManualEdit(id){
  const gstField = document.getElementById(`po-item-gst-${id}`);
  if(gstField){ gstField.dataset.touched = '1'; gstField.dataset.autofilled = '0'; }
  recalcPOTotal();
}
